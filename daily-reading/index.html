<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>酥酥老師每日讀報</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bpmf+Iansui&family=Iansui&family=Noto+Serif+TC:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="fonts.css">
<style>
/* VOICE: a real children's newspaper, warm because the teacher writes in its margins
   IDEA: the front page of a daily paper — masthead, issue line, headline, photo with caption, columns, then a worksheet page
   PICTURE: the story's photo slot drawn by hand (purple-lit harbour, light rail, a phone filming)
   COLOUR and TYPE: newsprint ground, black ink, one red spot colour, blue-ink teacher notes; Noto Serif TC for print, Iansui (秋茄體 when installed) for the teacher's hand
   LAYOUT: masthead > lead story with photo and columns > word column > idioms or grammar > worksheet > my scores > back issues */
:root{color-scheme:light dark;
 --paper:light-dark(#f4f2ec,#17181b);--sheet:light-dark(#fbfaf6,#1f2024);--ink:light-dark(#1b1b1b,#ecebe6);
 --soft:light-dark(#5b5b5b,#a8a7a1);--rule:light-dark(#1b1b1b,#ecebe6);--hair:light-dark(#cfcbc0,#3a3b40);
 --red:light-dark(#c8102e,#ff6075);--pen:light-dark(#2456a6,#8fb2ff);--note:light-dark(#fff3a8,#3d3820);
 --hl:light-dark(rgba(255,206,0,.42),rgba(255,206,0,.28));--ok:light-dark(#1f7a45,#6fd39a);--no:light-dark(#c8102e,#ff6075)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.8 "Noto Serif TC","Songti TC",serif;overflow-x:clip}
.hand{font-family:"曉聲通秋茄體","ToneOZ Tsuipita","Iansui","Noto Sans TC",sans-serif}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 max(4vw,16px)}
button{font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--red);outline-offset:2px}
/* masthead */
.strip{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 16px;padding:10px 0;font-size:14px;border-bottom:1px solid var(--hair)}
.strip .who{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{border:1.5px solid var(--ink);background:none;color:var(--ink);border-radius:999px;padding:6px 14px;min-height:40px;cursor:pointer;font-size:15px}
.chip.red{border-color:var(--red);background:var(--red);color:#fff}
.name{text-align:center;padding:18px 0 6px}
.name h1{font-weight:900;font-size:clamp(40px,8vw,84px);line-height:1;margin:0;letter-spacing:.06em}
.name p{margin:8px 0 0;font-size:15px;color:var(--soft)}
.bar{border-top:4px double var(--rule);border-bottom:1px solid var(--rule);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;margin-top:12px}
.bar nav{display:flex;flex-wrap:wrap}
.bar nav a{text-decoration:none;padding:8px 12px;min-height:44px;display:inline-flex;align-items:center}
.bar nav a:hover{color:var(--red)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.switch{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.switch button{border:0;background:none;color:var(--ink);padding:6px 16px;min-height:40px;cursor:pointer}
.switch button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
/* front page */
.front{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(20px,3vw,36px);padding:24px 0 8px;border-bottom:1px solid var(--rule)}
.kicker{color:var(--red);font-weight:700;font-size:15px;margin:0}
.headline{font-weight:900;font-size:clamp(32px,4.6vw,50px);line-height:1.15;margin:6px 0 10px;text-wrap:balance}
.deck{font-size:19px;line-height:1.6;margin:0 0 12px;color:var(--soft)}
.byline{font-size:14px;color:var(--soft);border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);padding:6px 0;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:4px 14px}
.cols{columns:2 17em;column-gap:28px;column-rule:1px solid var(--hair)}
.cols p{margin:0 0 .9em;text-align:justify}
.cols p:first-child::first-letter{float:left;font-size:3.3em;line-height:.9;font-weight:900;margin:.06em .1em 0 0;color:var(--red)}
.cols.en p{text-align:left;hyphens:auto}
mark{background:linear-gradient(transparent 55%,var(--hl) 55%);color:inherit;padding:0 1px;cursor:help;white-space:nowrap}
.cols u{text-decoration-color:var(--red);text-decoration-thickness:2px;text-underline-offset:3px}
figure{margin:0}
.photo{border:1px solid var(--rule);aspect-ratio:4/3;background:#3b2a6e}
.photo svg{width:100%;height:100%;display:block}
figcaption{font-size:14px;color:var(--soft);padding:6px 0 0;line-height:1.5}
.note{background:var(--note);color:var(--ink);padding:14px 18px 16px;margin:20px 6px 4px;transform:rotate(-1.5deg);box-shadow:0 6px 14px rgba(0,0,0,.12);font-size:18px;line-height:1.6;position:relative}
.note::before{content:"";position:absolute;top:-10px;left:50%;width:70px;height:20px;margin-left:-35px;background:rgba(255,255,255,.55);transform:rotate(2deg)}
.note b{display:block;color:var(--pen);font-weight:400;font-size:20px}
/* sections */
.sect{padding:28px 0;border-bottom:1px solid var(--rule)}
.sect>h2{font-weight:900;font-size:30px;line-height:1.2;margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.sect>h2 span{font-size:15px;font-weight:400;color:var(--soft)}
.sect>.sub{margin:4px 0 18px;color:var(--soft);font-size:15px}
.dict{columns:3 15em;column-gap:28px;column-rule:1px solid var(--hair)}
.entry{break-inside:avoid;padding:10px 0;border-bottom:1px dotted var(--hair)}
.entry b{font-size:22px;font-weight:900}
.entry .zy{font-size:13px;color:var(--ink);margin-left:6px}
.entry .pos{font-size:13px;color:var(--red);margin-left:6px;font-style:italic}
.entry p{margin:2px 0 0;font-size:16px;line-height:1.6}
.entry .ex{color:var(--soft);font-size:15px}
.idioms{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}
.idiom{background:var(--sheet);border:1px solid var(--rule);padding:18px 20px}
.idiom h3{font-weight:900;font-size:28px;letter-spacing:.12em;margin:0 0 6px;line-height:1.3}
.idiom dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:16px;line-height:1.6}
.idiom dt{color:var(--red);white-space:nowrap}
.idiom dd{margin:0}
.gram{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px}
.box{background:var(--sheet);border:1px solid var(--rule);padding:16px 18px}
.box h3{margin:0 0 8px;font-size:19px}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--hair);vertical-align:top}
th{font-weight:400;font-size:14px;color:var(--soft);border-bottom:1.5px solid var(--rule)}
/* worksheet */
.sheet{background:var(--sheet);border:1px solid var(--rule);padding:clamp(16px,3vw,32px);background-image:repeating-linear-gradient(transparent 0 35px,var(--hair) 35px 36px)}
.sec{font-weight:900;font-size:20px;margin:18px 0 8px;background:var(--sheet);display:inline-block;padding-right:8px}
.sec:first-child{margin-top:0}
.q{background:var(--sheet);border-left:3px solid var(--hair);padding:10px 14px;margin-bottom:12px}
.q .t{margin:0 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{border:1.5px solid var(--hair);background:var(--paper);color:var(--ink);padding:6px 14px;min-height:44px;cursor:pointer;text-align:left;border-radius:4px}
.opts button[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.q input,.q select,.q textarea,.field input{font:inherit;font-size:16px;padding:6px 10px;min-height:44px;border:1.5px solid var(--hair);background:var(--paper);color:var(--ink);border-radius:4px}
.q input,.q select{width:min(240px,100%)}
.q textarea{width:100%;min-height:96px}
.q.ok{border-left-color:var(--ok)}.q.no{border-left-color:var(--no)}
.fb{font-size:16px;margin-top:6px;display:none;color:var(--pen)}
.q.ok .fb,.q.no .fb{display:block}.q.ok .fb{color:var(--ok)}.q.no .fb{color:var(--no)}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:16px;background:var(--sheet);padding:4px 0}
.btn{border:0;background:var(--red);color:#fff;padding:10px 24px;min-height:44px;cursor:pointer;font-size:17px;border-radius:4px}
.btn.ghost{background:none;color:var(--ink);border:1.5px solid var(--ink)}
.score{font-size:24px;color:var(--red)}
.msg{font-size:15px;color:var(--pen)}
.past{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:0 28px}
.past a{display:block;text-decoration:none;padding:12px 0;border-bottom:1px dotted var(--hair)}
.past b{font-size:19px;display:block;line-height:1.4}
.past small{color:var(--soft)}
.empty{color:var(--soft);font-size:16px}
footer{padding:20px 0 40px;font-size:14px;color:var(--soft)}
footer a{word-break:break-all}
/* zhuyin mode: 曉聲通注音秋茄 (OFL) subset; Bpmf Iansui only as a fallback */
@font-face{font-family:"SusuZhuyin";src:url("zhuyin.woff") format("woff");font-display:swap}
#bpmfBtn[aria-pressed=true]{background:var(--pen);border-color:var(--pen);color:#fff}
body.bpmf:not([data-lang=en]) :is(#title,#deck,#body,#caption,#teacherNote,#wordList,#extra,#quiz){font-family:"SusuZhuyin","Bpmf Iansui","Iansui",sans-serif}
body.bpmf:not([data-lang=en]) #title{font-weight:400;line-height:1.35}
body.bpmf:not([data-lang=en]) #body{columns:1;font-size:20px;line-height:2.2}
body.bpmf:not([data-lang=en]) #body p{text-align:left}
body.bpmf:not([data-lang=en]) :is(.entry p,.idiom dl,.q){line-height:2}
body.bpmf:not([data-lang=en]) :is(.idiom h3,.entry b,.sec,.sect>h2){font-weight:400}
#print.bpmf :is(.hl,.dk,.cols2,.cap,.sticky,.think,.vc,.ic,.qq,.qs,.op){font-family:"SusuZhuyin","Bpmf Iansui","Iansui",sans-serif}
#print.bpmf :is(.hl,.ic h3,.vc b,.qs){font-weight:400}
#print.bpmf .cols2{columns:1;font-size:15.5px;line-height:2.05}
#print.bpmf .cols2 p{text-align:left}
#print.bpmf .lead{grid-template-columns:minmax(0,1fr) 210px;gap:18px}
#print.bpmf :is(.vc p,.ic dl,.qq){line-height:1.9}
/* login */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.overlay.on{display:flex}
.modal{background:var(--sheet);color:var(--ink);border:1px solid var(--rule);padding:24px;width:min(420px,100%);box-shadow:0 20px 40px rgba(0,0,0,.25)}
.modal h2{margin:0 0 4px;font-size:26px;font-weight:900}
.field{display:block;margin:12px 0}
.field span{display:block;font-size:15px;color:var(--soft)}
.field input{width:100%}
/* printable sheet: rendered off-screen for PDF, shown only when printing */
#print{position:absolute;left:-10000px;top:0;width:794px;color:#1b1b1b;font:14.5px/1.75 "Noto Serif TC",serif;color-scheme:light}
#print .pg{width:794px;min-height:1123px;background:#fff;padding:40px 46px 64px;position:relative;margin-bottom:20px;display:flex;flex-direction:column}
#print .hand{font-family:"曉聲通秋茄體","ToneOZ Tsuipita","Iansui",sans-serif}
#print .pm{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:end;gap:14px;border-bottom:5px solid #c8102e;padding-bottom:8px}
#print .pm h1{margin:0;font-size:38px;font-weight:900;letter-spacing:.06em;line-height:1}
#print .pm .ed{font-size:12px;color:#555;line-height:1.5}
#print .pm .no{background:#c8102e;color:#fff;font-weight:900;font-size:15px;padding:6px 12px;line-height:1.3;text-align:center}
#print .strip2{display:flex;justify-content:space-between;font-size:12px;color:#555;border-bottom:1px solid #1b1b1b;padding:4px 0;margin-bottom:16px}
#print .kick{display:inline-block;background:#7a55d1;color:#fff;font-size:13px;padding:2px 10px;margin-bottom:6px}
#print .hl{font-size:31px;font-weight:900;line-height:1.25;margin:0 0 6px}
#print .dk{font-size:15px;color:#555;margin:0 0 14px;border-left:4px solid #7a55d1;padding-left:10px}
#print .lead{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:22px}
#print .cols2{columns:2;column-gap:20px;column-rule:1px solid #ddd}
#print .cols2 p{margin:0 0 6px;text-align:justify}
#print .cols2.one{columns:1}
#print .cols2 p:first-child::first-letter{float:left;font-size:3em;line-height:.9;font-weight:900;margin:.06em .08em 0 0;color:#c8102e}
#print mark{background:linear-gradient(transparent 55%,#ffe066 55%);color:inherit;white-space:nowrap;display:inline-block;line-height:1.3}
#print u{text-decoration-color:#c8102e;text-decoration-thickness:2px;text-underline-offset:3px}
#print .ph{border:1px solid #1b1b1b;aspect-ratio:4/3}
#print .ph svg{width:100%;height:100%;display:block}
#print .cap{font-size:11.5px;color:#666;line-height:1.5;margin:4px 0 14px}
#print .sticky{background:#fff3a8;padding:12px 14px;transform:rotate(-1.5deg);font-size:15px;line-height:1.6;box-shadow:0 4px 10px rgba(0,0,0,.12)}
#print .sticky b{display:block;color:#2456a6;font-weight:400;font-size:17px}
#print .think{margin-top:auto;border:2px dashed #7a55d1;border-radius:14px;padding:10px 16px;background:#f5f0ff}
#print .think b{color:#7a55d1}
#print .sh{display:flex;align-items:center;gap:10px;margin:0 0 12px}
#print .sh span{background:#2f7fc1;color:#fff;font-weight:900;font-size:17px;padding:4px 14px}
#print .sh.red span{background:#c8102e}#print .sh.pur span{background:#7a55d1}
#print .sh i{flex:1;border-top:2px solid currentColor;color:#ddd}
#print .vg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
#print .vg.e3{grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}#print .vg.e3 .vc{padding:6px 10px}
#print .vc{border:1.5px solid #cfe3f4;background:#f2f8fd;border-radius:10px;padding:8px 12px;break-inside:avoid}
#print .vc b{font-size:19px;font-weight:900}
#print .vc .z{font-size:11px;color:#1b1b1b;margin-left:6px}
#print .vc p{margin:0;font-size:13.5px;line-height:1.55}
#print .vc .x{color:#555}
#print .ig{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
#print .ic{border:2px solid #c8102e;border-radius:12px;overflow:hidden;background:#fff}
#print .ic h3{margin:0;background:#c8102e;color:#fff;text-align:center;font-size:22px;letter-spacing:.14em;padding:6px 0;font-weight:900}
#print .ic dl{margin:0;padding:8px 12px;font-size:13px;line-height:1.55;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 8px}
#print .ic dt{color:#c8102e;font-weight:700;white-space:nowrap}#print .ic dd{margin:0}
#print .gt{display:grid;grid-template-columns:1fr 1fr;gap:14px}
#print .gb{border:2px solid #c8102e;border-radius:12px;padding:10px 14px}
#print .gb h3{margin:0 0 6px;font-size:16px;color:#c8102e}
#print table{border-collapse:collapse;width:100%;font-size:13px}
#print th,#print td{border-bottom:1px solid #e3e3e3;padding:4px 6px;text-align:left;color:#1b1b1b}
#print th{background:#fdecef;color:#c8102e;font-weight:700}
#print .nm{display:flex;gap:24px;font-size:15px;margin-bottom:6px}
#print .nm span{flex:1;border-bottom:1.5px solid #1b1b1b;padding-bottom:2px}
#print .qs{font-weight:900;font-size:16px;color:#7a55d1;margin:8px 0 4px;border-bottom:2px solid #e6dcfa;padding-bottom:2px}
#print .qq{margin:0 0 4px;break-inside:avoid;line-height:1.6}
#print .qq p{margin:0}
#print .op{font-size:13px;color:#444;padding-left:22px}
#print .bx{display:inline-block;width:34px;height:22px;border:1.5px solid #1b1b1b;border-radius:4px;vertical-align:middle;margin-right:6px}
#print .ln{border-bottom:1px solid #aaa;height:28px}
#print .key{margin-top:auto;border-top:2px dashed #999;padding-top:8px;font-size:12px;color:#555;position:relative}
#print .key::before{content:"✂ 答案可沿虛線剪下";position:absolute;top:-11px;left:0;background:#fff;padding-right:8px;font-size:11px}
#print .ft{position:absolute;left:46px;right:46px;bottom:22px;display:flex;justify-content:space-between;font-size:11px;color:#888;border-top:1px solid #ddd;padding-top:6px}
@media(max-width:760px){.front{grid-template-columns:minmax(0,1fr)}.front figure{order:-1}}
@media(max-width:600px){.cols p{text-align:left}.strip{font-size:13px}}
@media(prefers-reduced-motion:no-preference){.glow{animation:glow 3s ease-in-out infinite alternate}@keyframes glow{from{opacity:.3}to{opacity:.8}}}
@page{size:A4;margin:0}
@media print{body{background:#fff}body>*:not(#print){display:none!important}#print{position:static}#print .pg{margin:0;break-after:page;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<header class="wrap">
 <div class="strip">
  <span id="issue"></span>
  <div class="who"><span id="whoTxt" class="hand"></span><button class="chip" id="loginBtn" type="button">學生登入</button></div>
 </div>
 <div class="name"><h1>酥酥老師每日讀報</h1><p>給國小、國中生的時事報・每天一篇，讀懂世界、學好中英文</p></div>
 <div class="bar">
  <nav aria-label="主選單"><a href="#story" id="navStory">今日頭條</a><a href="#words">生詞</a><a href="#practice">練習題</a><a href="#scores">我的成績</a><a href="#past">往期</a></nav>
  <div class="tools">
   <div class="switch" role="group" aria-label="切換語言"><button id="bZh" type="button" aria-pressed="true">中文・國小</button><button id="bZj" type="button" aria-pressed="false">中文・國中</button><button id="bEn" type="button" aria-pressed="false">English</button></div>
   <button class="chip" id="bpmfBtn" type="button" aria-pressed="false" title="在國字旁邊加上注音">ㄅ 注音</button>
   <button class="chip red" id="pdfBtn" type="button">下載 PDF</button>
   <button class="chip" id="printBtn" type="button" hidden>列印</button>
  </div>
 </div>
 <p class="msg" id="pdfMsg" aria-live="polite"></p>
</header>

<main class="wrap">
<article class="front" id="story">
 <div>
  <p class="kicker" id="kicker"></p>
  <h2 class="headline" id="title"></h2>
  <p class="deck" id="deck"></p>
  <div class="byline" id="byline"></div>
  <div class="cols" id="body"></div>
 </div>
 <aside>
  <figure>
   <div class="photo" id="photo" aria-hidden="true"></div>
   <figcaption id="caption"></figcaption>
  </figure>
  <div class="note hand"><b>酥酥老師的話</b><span id="teacherNote"></span></div>
 </aside>
</article>

<section class="sect" id="words">
 <h2 id="wH"></h2>
 <p class="sub" id="wSub"></p>
 <div class="dict" id="wordList"></div>
</section>

<section class="sect" id="extra"></section>

<section class="sect" id="practice">
 <h2 id="pH"></h2>
 <p class="sub" id="pSub"></p>
 <form class="sheet" id="quiz" novalidate></form>
</section>

<section class="sect" id="scores">
 <h2>我的成績 <span id="scoreMode"></span></h2>
 <p class="sub" id="scoreSub"></p>
 <div id="scoreList"></div>
</section>

<section class="sect" id="past">
 <h2>往期文章 <span>每天一篇</span></h2>
 <div class="past" id="pastList"></div>
</section>
</main>

<footer class="wrap">
 <p id="src"></p>
 <p>酥酥老師家教｜Instagram、Threads：@crispyyyyy0121</p>
</footer>

<div class="overlay" id="loginBox" role="dialog" aria-modal="true" aria-labelledby="lH">
 <form class="modal" id="loginForm" novalidate>
  <h2 id="lH">學生登入</h2>
  <p class="sub" id="lSub" style="margin:0;color:var(--soft);font-size:15px"></p>
  <label class="field"><span id="idLabel">學生代號</span><input id="sid" autocomplete="username" required></label>

 zh:{level:"國小高年級",edition:"中文・國小版",len:"約 600 字・閱讀約 5 分鐘",kicker:"科技・AI｜台北",title:"手機的「小腦袋」學會抓重點！台大新晶片超省電",
  deck:"和 AI 聊天聊到一半，手機就快沒電了，好掃興^1！台大楊家驤教授的團隊做出兩代「AI 學習晶片」，它們會像考前畫重點一樣，只算最重要的部分^1，讓 AI 又快又省電。",

  note:"讀完後想一想：你考試前怎麼「畫重點」？和晶片抓重點的方法像不像？畫線的詞語，試著自己造句！",
  body:[
   "你有沒有遇過這種事：用手機和 AI 聊天，聊著聊著，電池就快沒電了？原來，會聊天、會畫圖的「生成式 AI」非常{耗電}。現在大部分^1的 AI，都要把你的問題傳到很遠的地方，請一大群超級電腦幫忙想答案。",
   "11 月 25 日，國科會介紹了一個好消息：國立台灣大學電機系楊家驤教授的團隊，做出了兩代「AI 學習晶片」。{晶片}就像電子產品的小腦袋，雖然小小一片，卻能做非常多的計算。新晶片又快又{省電}，能讓 AI 直接「住」在手機、機器人裡面工作。",
   "它省電的{秘訣}是什^2麼？答案是：會「抓重點」！楊教授用讀文章來比喻：讀一篇很長的文章時，聰明的讀者會先找出{關鍵}字和重點，不會每個字都花一樣多的力氣，就像考試前用螢光筆畫重點一樣。新晶片也是這樣：先挑^1出重要的資料來算，不重要的就{略過}。團隊的原則很簡單：「只算必要的，少搬資料！」",
   "這樣到底有多省電？第二代晶片每用 1 瓦的電，每秒最多可以做 157 兆次計算！1 兆有多大呢？如果你每秒數^1一個數，不吃不睡，也要數^1三萬多年才數^1得^1完 1 兆！和其他同類型的學習晶片比起來，新晶片的{效率}高了 1.6 到 7.6 倍。",
   "不過，世界上沒有十全十美的東西。為^1了省電，晶片會少算一些細節，準確度會稍微低一點；但是像查資料、簡單修照片這類事情，已經很夠用了。",
   "這兩代晶片的研究，已經分別在 2024 年和 2025 年的國際研討會上{發表}。團隊還設計好了更^1小、更^1先進的下一代晶片，今年 10 月已經交給工廠製作。未來，手機、機器人，甚至沒有司機的車子^1，都可能裝上這種會抓重點的晶片。說不定有一天，你的手機能更^1省電地^1陪你聊天、幫你查資料呢！"],

   {k:"mc",t:"新晶片省電的秘訣是什^2麼？",o:["把螢幕亮度調暗","會「抓重點」，只算重要的部分^1","每天休息八小時","把電池做得^1更^1大"],a:1},

 zhj:{level:"國中",edition:"中文・國中版",len:"約 850 字・閱讀約 6 分鐘",kicker:"科技・AI｜台北",title:"AI 也要學會「抓重點」：台大晶片讓生成式 AI 更^1省電",
  deck:"國科會 11 月 25 日公布台大電機系楊家驤教授團隊的成果：兩代 Transformer 學習處理器晶片，大幅提升能量效率，讓生成式 AI 有機會直接在手機、機器人等裝置上運作。",
  caption:"插圖：晶片拿著放大鏡，從一長串資料中只挑^1出關鍵的部分^1運算；手機與機器人在一旁使用本地端 AI。",
  note:"讀完後想一想：晶片的「抓重點」和你讀書時畫重點有什^2麼相^1似之處^1？為^1什^2麼「少搬資料」也能省電？",
  body:[
   "手機電量只剩 10%，你卻還想請 AI 幫忙整理報告重點——如果 AI 能直接在手機上又快又省電地^1運作，該有多好？從聊天機器人到 AI 繪圖，生成式 AI 已經走進許多人的生活。不過，這類 AI 需要大量{運算}，目前多半{仰賴}雲端的大型資料中心；資料必須在裝置和雲端之間來回傳送，不但耗費能源，也得^2依靠網路連線。",
   "11 月 25 日，國科會舉辦研究成果記者會，展示國立台灣大學電機工程學系楊家驤教授團隊開發的兩代「Transformer 學習處理器」晶片。Transformer 是許多生成式 AI 背後的核心技術；團隊從 AI 演算法、硬體架構到晶片設計進行跨層{整合}，目標是讓生成式 AI 在「本地端」，也就是手機等裝置本身，就能有效率地^1運作。",
   "第一代晶片採用 40 奈米製程，是文獻上第一顆同時{支援} Transformer「{推論}」與「訓練」加速的學習處理器。推論，是 AI 運用已學到的知識產生答案；訓練，則是 AI 從資料中學習、調整自己。它的關鍵在於：在投入大量運算前，先找出資料之間重要的關聯，略過不重要的部分^1，再搭配近似與低精度運算。這顆晶片的最高能量效率達到每瓦 99.2 TOPS（TOPS 指每秒兆次運算），比當時文獻上先進的 Transformer 推論專用處理器高出 2.6 至 162 倍。",
   "第二代晶片進一步改良，最高能量效率達 157 TOPS/W，比先進的 Transformer 學習處理器高出 1.6 至 7.6 倍，面積效率也提升 1.3 至 3.2 倍。楊家驤用閱讀來比喻：讀一篇長文章時，先抓住關鍵字和重點，而不是對每個字都投入同樣的心力。團隊的原則，就是「只算必要的，少搬資料」。",
   "當然，效率與準確度之間需要{取捨}。報導指出，這類高效能晶片犧牲了一部分^1準確度，換來更^1省電、更^1快速的運算；不過，對於一般的網路資料蒐集或簡單的照片修圖，已經相^1當足夠。",
   "兩代成果已分別在 2024 年與 2025 年發表於國際重要的 IEEE 超大型積體電路研討會（VLSI）。團隊的下一代晶片改用更^1先進的 16 奈米製程，已在今年 10 月下線（完成設計、送交晶圓廠製造）。它的重點放在生成式 AI 推論時的記憶體頻寬{瓶頸}，{優化}外部記憶體的資料流與控制流程，並壓縮運算資料。",
   "這項研究在國科會「晶創台灣方案」支持下完成。國科會工程處^1處^1長^1也指出，生成式 AI 已從雲端的大型語言模型，延伸到手機、筆電、機器人與自駕車等「邊緣端」。若晶片能在省電的同時保持夠用的準確度，未來我們口袋裡的手機，或許就能成為更^1聰明、也更^1節能的 AI 夥伴。"],

   ["推論","ㄊㄨㄟ ㄌㄨㄣˋ","根據已知的事推出結論；AI 中指運用學到的知識產生答案","偵探根據腳印做出推論。"],

   ["優化","ㄧㄡ ㄏㄨㄚˋ","改良，使變得^1更^1好","工程師優化程式，讓網頁開得^1更^1快。"]],

   ["提綱挈領","提起網的總繩、拎起衣服的領子^1；比喻抓住重點","讀長文章時先抓住關鍵字和重點","老師上課提綱挈領，讓我們一下子^1就懂了。"],

   {k:"mc",t:"同學讀完文章後說了下面四句話，哪一句最能說明晶片省電的原理？",o:["「晶片把電池做得^1更^1大。」","「晶片先找出重要的關聯，略過不重要的部分^1。」","「晶片把所有資料都傳到雲端去算。」","「晶片每個資料都算得^1一樣仔細。」"],a:1},
   {k:"mc",t:"下一代晶片的研發重點是什^2麼？",o:["讓晶片體積變得^1更^1大","解決推論時的記憶體頻寬瓶頸","改用 40 奈米製程","完全不需要記憶體"],a:1},
   {k:"mc",t:"根據文章，下列敘述何者「錯誤」？",o:["兩代成果曾發表於 VLSI 研討會","高效能晶片犧牲了一部分^1準確度","下一代晶片已在今年 10 月下線","這些晶片只能在大型資料中心使用"],a:3,why:"團隊的目標正是讓生成式 AI 在手機等本地端裝置上運作。"},

 en:{level:"國小高年級～國中",edition:"English Edition",len:"About 200 words・CEFR A2",kicker:"Technology・AI",title:"Can a Chip Find the Main Idea?",
  deck:"Is your phone battery low again? A team in Taiwan made AI chips that save energy by doing only the important work.",
  caption:"Illustration: A happy little chip uses a magnifying glass to find the important parts. A phone and a robot use AI nearby.",
  note:"螢光筆畫的是生詞，畫底線的是連接詞 because（因為）和 so（所以）。注意：英文的 because 和 so 不能放在同一個句子裡喔！",
  body:[
   "Is your phone battery low again? Chatting with AI can use a lot of {energy}! AI that can write stories and draw pictures is called {generative} AI. Most AI runs on big computers far away, {so} your phone has to send data to them.",
   "On November 25, a team from National Taiwan University (NTU) showed two new AI {chip}s. Professor Yang Chia-hsiang leads the team. The chips are fast and save energy, {so} phones and robots can use AI by themselves.",
   "What is their secret? They find the main idea! When you study for a test, you look for the {keyword}s first {because} not every word is important. The chips work the same way. They only {calculate} the important parts, {so} they do less work.",
   "The second chip is very {efficient}. With 1 watt of power, it can do up to 157 trillion calculations every second. That's a lot! Counting to one trillion would take you more than 30,000 years! The chips are a little less {accurate}, but they are good enough for many everyday jobs, like looking things up online.",
   "The team has already designed a newer, smaller chip. In the {future}, phones, robots, and even cars without drivers may use chips like these. Maybe one day, your phone will be your AI helper {because} it has a smart chip inside!"],
  words:[
   ["generative","adj.","生成的（生成式 AI：會自己寫文章、畫圖的 AI）","Generative AI can write a short story."],
   ["energy","n.","能源、電力；精力","Turn off the lights to save energy."],
   ["chip","n.","晶片","There is a tiny chip inside my watch."],
   ["keyword","n.","關鍵字","Circle the keywords in the question."],
   ["calculate","v.","計算","Can you calculate 25 × 4?"],
   ["efficient","adj.","有效率的","This new fridge is very efficient."],

  grammar:{name:"連接詞 because／so",
   intro:"because（因為）後面接「原因」，so（所以）後面接「結果」。中文常說「因為……所以……」，但英文一句話裡只能選一個！例：You look for the keywords first because not every word is important.",
   task:"用 because 和 so 各寫一句話，說說你喜歡（或不喜歡）某樣科技產品的原因。例：I like my tablet because I can read e-books on it.",
   cols:[
    [{h:"1. because 和 so：原因 vs. 結果",head:["連接詞","後面接","例句"],rows:[["because","原因（為什麼）","I'm tired because I stayed up late."],["so","結果（所以）","I stayed up late, so I'm tired."]],bold:0},
     {h:"2. 同一件事，兩種說法",rows:[["原因, so 結果","It rained, so we stayed home."],["結果 because 原因","We stayed home because it rained."]]}],
    [{h:"3. 不要「因為……所以……」一起用",head:["✗ 錯誤","✓ 正確"],rows:[["Because it rained, so we stayed home.","Because it rained, we stayed home."],["Because I was sick, so I didn't go.","I was sick, so I didn't go."]],bold:1},
     {h:"4. 逗號小提醒",p:"so 前面通常加逗號：It was late<b>,</b> so I went to bed.<br>because 放句首時，中間加逗號：Because it was late<b>,</b> I went to bed."},
     {h:"5. 新聞裡的 because 和 so",p:"You look for the keywords first <b>because</b> not every word is important.<br>They only calculate the important parts, <b>so</b> they do less work."}]]},

 id:"2026-11-26-beishi-river-fish",no:5,date:"2026-11-26",cat:"自然・生態",level:"國小高年級～國中",
 zh:{level:"國小高年級",edition:"中文・國小版",len:"約 550 字・閱讀約 4 分鐘",kicker:"自然・生態｜新北",title:"潛水員下水抓「外來客」，守護台灣小魚！",
  deck:"新北市坪林的北勢溪，住著許多台灣原生的小魚。研究團隊今年第一次背^1著氣瓶潛到水裡，抓走了 371 尾外來種魚！",
  caption:"插圖：清澈的溪水裡，潛水員正把一條大大的外來種魚裝進網子^1；石頭^1旁邊，幾條台灣原生小魚安心地^1游來游去。",
  note:"讀完後想一想：外來種魚是怎麼跑進溪裡的？我們可以怎麼幫忙？畫線的詞語，試著自己造句！",
  body:[
   "新北市坪林區有一條清澈的溪流，叫做北勢溪。新北市政府農業局和國立台灣海洋大學的研究團隊合作，最近潛到北勢溪的水裡，一口氣{移除}了 371 尾外來種魚，其中有 128 尾是大型的魚。",
   "什^2麼是「外來種」呢？就是原本不住在這裡，被人從別的地方帶來的生物。北勢溪裡的外來種，有吳郭魚、吉利慈鯛，還有被叫做「藍寶石」的巴西珠母麗魚。牠們很可能是因為^1有人{放生}、{棄養}或餵食，才進到溪裡，然後越生越多。",
   "外來種魚多了，會和台灣{原生}的魚搶食物、搶住的地方，讓溪裡原本的{平衡}被打亂。北勢溪的源頭，曾經發現過{珍稀}的「噶瑪蘭青鱂」（鱂，讀音同「將」），牠的身體只有大約 3 公分長，比你的大拇指還短；上游的小溪裡，也住著「陽明山吻蝦虎」。這些小魚都需要我們保護。",
   "這次研究團隊用的方法很特別：今年第一次背^1著氣瓶，用「水肺潛水」的方式下水。海洋大學的陳義雄教授說，北勢溪的水很乾淨，看得^1很清楚，所以魚一看到人就跑走了，在岸邊很難抓到大魚。大型的外來種魚喜歡在比較深的水潭裡生寶寶，潛水員直接潛到深處^1，就能把準備生寶寶的大魚抓走，不讓牠們越生越多。",
   "抓到的魚，研究人員會先{記錄}牠們的種類和大小，再妥善處理，不會再讓牠們回到河裡。這些資料可以幫助大家了^1解：溪裡的魚有多少、住在哪裡。",
   "農業局也{呼籲}大家：不要隨便放生，也不要棄養寵物魚。想一想，一條小小的魚放錯了地方，就可能變成整條溪的大麻煩呢！"],
  words:[
   ["移除","ㄧˊ ㄔㄨˊ","拿走、去掉","我們把花園裡的雜草全部移除了。"],
   ["放生","ㄈㄤˋ ㄕㄥ","把抓來或買來的動物放到野外","隨便放生動物，可能會傷害大自然。"],
   ["棄養","ㄑㄧˋ ㄧㄤˇ","養了寵物以後，又把牠丟掉不養","養寵物前要想清楚，千萬不可以棄養。"],
   ["原生","ㄩㄢˊ ㄕㄥ","本來就生長^1在這個地方的","台灣黑熊是台灣的原生動物。"],
   ["平衡","ㄆㄧㄥˊ ㄏㄥˊ","各方面保持穩定，不偏向一邊","走在平衡木上，要張開雙手保持平衡。"],
   ["珍稀","ㄓㄣ ㄒㄧ","珍貴又稀少","這座森林裡住著許多珍稀的鳥類。"],
   ["記錄","ㄐㄧˋ ㄌㄨˋ","把看到、聽到的事寫下來或拍下來","我每天在日記裡記錄發生的事。"],
   ["呼籲","ㄏㄨ ㄩˋ","公開向大家請求或提醒","校長呼籲大家一起節約用水。"]],
  idioms:[
   ["不速之客","沒有被邀請，卻突然跑來的客人","外來種魚沒有被邀請，卻住進了北勢溪","我們在公園野餐時，一群螞蟻成了不速之客。"],
   ["喧賓奪主","客人的聲音比主人還大；比喻外來的反而搶走了原本主人的位子^1","外來種魚越來越多，搶走原生魚的食物和家","這幅畫的背景太花俏，有點喧賓奪主。"],
   ["清澈見底","水非常清，可以一眼看到水底","北勢溪的水很乾淨，看得^1很清楚","山上的小溪清澈見底，連小石頭都看得^1一清二楚。"]],
  quiz:[
   {k:"sec",t:"一、閱讀理解"},
   {k:"mc",t:"研究團隊這次在北勢溪移除了多少尾外來種魚？",o:["128 尾","243 尾","371 尾","3 尾"],a:2},
   {k:"mc",t:"下列哪一種「不是」文中提到的外來種魚？",o:["吳郭魚","吉利慈鯛","巴西珠母麗魚","噶瑪蘭青鱂"],a:3,why:"噶瑪蘭青鱂是台灣珍稀的原生魚。"},
   {k:"mc",t:"外來種魚變多了，會對溪流造成什^2麼影響？",o:["讓溪水變得^1更^1乾淨","和原生魚搶食物和住的地方","讓原生魚長^1得^1更^1大","沒有任何影響"],a:1},
   {k:"mc",t:"研究團隊為^1什^2麼要用「水肺潛水」抓魚？",o:["因為^1溪水太髒，看不到魚","因為^1大型外來種在深水潭生寶寶，潛下去才抓得^1到","因為^1潛水比較好玩","因為^1岸邊有太多人"],a:1},
   {k:"sec",t:"二、詞語填空"},
   {k:"sel",t:"養狗是一輩子^1的責任，千萬不可以＿＿＿。",o:["棄養","原生","記錄"],a:0},
   {k:"sel",t:"校長＿＿＿大家下課時不要在走廊奔跑。",o:["珍稀","呼籲","移除"],a:1},
   {k:"sel",t:"這種花只長^1在高山上，數量很少，非常＿＿＿。",o:["平衡","珍稀","放生"],a:1},
   {k:"sec",t:"三、成語選填"},
   {k:"sel",t:"湖水＿＿＿，可以看到小魚在水草間游來游去。",o:["不速之客","喧賓奪主","清澈見底"],a:2},
   {k:"sel",t:"上課時，一隻麻雀突然飛進教室，成了＿＿＿。",o:["不速之客","喧賓奪主","清澈見底"],a:0},
   {k:"sec",t:"四、想一想"},
   {k:"open",t:"如果你的朋友^1說，他養的魚長^1太大了，想把牠放到附近的河裡，你會怎麼勸他？請寫出你的理由。"}]},
 zhj:{level:"國中",edition:"中文・國中版",len:"約 750 字・閱讀約 6 分鐘",kicker:"自然・生態｜新北",title:"潛入深潭抓「入侵者」：北勢溪的外來種移除行動",
  deck:"新北市農業局與海洋大學團隊今年首度以水肺潛水進入坪林北勢溪，移除 371 尾外來種魚。科學監測，正成為守護原生魚類的新方法。",
  caption:"插圖：水肺潛水員在清澈的深潭中捕捉大型外來種魚；岩石邊，嬌小的原生魚悠游其間。",
  note:"讀完後想一想：「放生」原本是出於好意，為^1什^2麼可能帶來生態問題？試著用文中「族群」「棲地」的概念說明。",
  body:[
   "新北市坪林區的北勢溪水質清澈，孕育了豐富的淡水生態。新北市政府農業局與國立台灣海洋大學研究團隊合作，日前在北勢溪進行水下生態調^1查與外來種移除，共捕獲 371 尾外來種魚，包括大型魚 128 尾、中小型魚 243 尾。這也是農業局今年首度導入水肺潛水調^1查。",
   "這次移除的外來種，包括吳郭魚、吉利慈鯛，以及俗稱「藍寶石」的巴西珠母麗魚。農業局指出，部分^1外來魚種可能因民眾放生、棄養或餵養等人為因素進入溪流，並逐漸建立{族群}，與原生魚類競爭食物及{棲地}，進而影響原有的生態平衡。",
   "北勢溪並非一條普通的溪流。在它的源頭，曾發現體長約 3 公分的珍稀原生魚種「噶瑪蘭青鱂」（鱂，讀音同「將」）；上游的原始支流中，也曾記錄到「陽明山吻蝦虎」的族群。一旦外來種大量繁殖，這些體型嬌小的原生魚，生存空間就可能受到{壓縮}。",
   "為^1什^2麼要用水肺潛水？海洋大學海洋生物研究所教授陳義雄解釋，北勢溪水質乾淨、主流寬闊、能見度高，若在岸邊撒網或自由潛水，魚隻容易{警覺}而逃走，很難捕捉到中大型成魚。此外，大型外來種習慣在較深的水潭、水流緩慢的深淵產卵{繁殖}；水肺潛水能讓研究人員{直搗}繁殖棲所，有效移除正值繁殖期的成魚，從源頭減少外來種的數量。",
   "捕獲的魚隻會先記錄種類與形質資料，再經人道處理後運離現場，避免再次進入其他水域。農業局表示，這些調^1查資料將作為後續管理的{依據}，幫助掌握魚類族群的數量、分布與棲地變化。",
   "生態保育不只是政府和科學家的責任。農業局呼籲民眾不要棄養、不要放生。一次看似出於{善意}的放生，可能讓外來種在溪裡落地生根；最後，得^2靠研究人員背^1著氣瓶潛入深潭，一尾一尾地^1把牠們帶走。"],
  words:[
   ["族群","ㄗㄨˊ ㄑㄩㄣˊ","生物學上指生活在同一地區的同一種生物","這座島上的梅花鹿族群越來越大。"],
   ["棲地","ㄑㄧ ㄉㄧˋ","動物居住、生活的地方","濕地是許多候鳥重要的棲地。"],
   ["壓縮","ㄧㄚ ㄙㄨㄛ","用力使體積或範圍變小","城市不斷擴大，壓縮了野生動物的生活空間。"],
   ["警覺","ㄐㄧㄥˇ ㄐㄩㄝˊ","對危險或變化很敏感，很快就察覺","小鹿非常警覺，一聽到聲響就跑走了。"],
   ["繁殖","ㄈㄢˊ ㄓˊ","生物生出下一代，使數量增加","春天是許多鳥類繁殖的季節。"],
   ["直搗","ㄓˊ ㄉㄠˇ","直接攻進對方的根據地","球員突破防守，直搗對方球門。"],
   ["依據","ㄧ ㄐㄩˋ","做判斷或行動的根據","老師依據大家的表現來評分。"],
   ["善意","ㄕㄢˋ ㄧˋ","好心、好意","他出於善意提醒我，我很感謝。"]],
  idioms:[
   ["喧賓奪主","客人的聲音蓋過主人；比喻外來或次要的事物，占據了原有或主要事物的地位","外來種大量繁殖，搶占原生魚的食物與棲地","這篇作文的開頭寫得^1太長，反而喧賓奪主，蓋過了主題。"],
   ["落地生根","植物落到地上就生根；比喻在某個地方長久定居下來","外來種被放生後，在溪中建立族群","爺爺^1年輕時來到台北打拚，從此在這裡落地生根。"],
   ["防微杜漸","在壞事剛出現時就加以制止，不讓它擴大","在繁殖期移除成魚，從源頭減少外來種","小小的蛀牙也要盡早處理，防微杜漸才能保護牙齒。"],
   ["斬草除根","除草要連根拔起；比喻徹底消除禍害的根源","潛入深潭，直搗外來種的繁殖棲所","要解決蟑螂問題，必須斬草除根，清掉牠們躲藏的地方。"]],
  quiz:[
   {k:"sec",t:"一、閱讀理解"},
   {k:"mc",t:"根據第一段，這次移除的外來種中，中小型魚有幾尾？",o:["128 尾","243 尾","371 尾","3 尾"],a:1},
   {k:"mc",t:"陳義雄教授認為，在北勢溪「岸邊撒網」效果不好的原因是什^2麼？",o:["溪水太混濁，看不見魚","水質乾淨、能見度高，魚容易警覺而逃走","溪裡沒有大型魚","岸邊太危險，不能靠近"],a:1},
   {k:"mc",t:"下列關於北勢溪原生魚的敘述，何者正確？",o:["噶瑪蘭青鱂體長約 3 公分，曾在溪的源頭被發現","陽明山吻蝦虎是外來種","「藍寶石」是台灣原生魚","噶瑪蘭青鱂是這次移除的對象"],a:0},
   {k:"mc",t:"文中提到外來種進入溪流的人為因素，「不包括」下列哪一項？",o:["放生","棄養","餵養","颱風把魚沖進溪裡"],a:3,why:"文中提到的人為因素是放生、棄養及餵養。"},
   {k:"sec",t:"二、詞語選填"},
   {k:"sel",t:"籃球隊員一路突破防守，＿＿＿籃下得分。",o:["直搗","依據","善意"],a:0},
   {k:"sel",t:"森林被大量砍伐，＿＿＿了台灣黑熊的生活範圍。",o:["警覺","壓縮","族群"],a:1},
   {k:"sel",t:"法官＿＿＿法律做出判決。",o:["依據","繁殖","棲地"],a:0},
   {k:"sec",t:"三、成語選填"},
   {k:"sel",t:"布置教室時，裝飾品太多反而＿＿＿，讓人看不清楚布告欄的重要公告。",o:["喧賓奪主","落地生根","防微杜漸","斬草除根"],a:0},
   {k:"sel",t:"許多新住民來到台灣後＿＿＿，成為我們的好鄰居。",o:["喧賓奪主","落地生根","防微杜漸","斬草除根"],a:1},
   {k:"sec",t:"四、想一想"},
   {k:"open",t:"有人認為「放生是做善事」。讀完這篇報導後，你同意嗎？請引用文中的資訊，說明你的看法。"}]},
 en:{level:"國小高年級～國中",edition:"English Edition",len:"About 180 words・CEFR A2",kicker:"Nature・Animals",title:"Divers Help Taiwan's Little Fish",
  deck:"In New Taipei, divers went down into the Beishi River and took out 371 fish that do not belong there.",
  caption:"Illustration: A diver catches a big invasive fish. Small native fish swim near the rocks.",
  note:"螢光筆畫的是生詞，畫底線的是情態助動詞 can／must／should。注意：它們後面的動詞都用原形喔！",
  body:[
   "The Beishi River in Pinglin, New Taipei, is very clean. Many small {native} fish live there. But some {invasive} fish live there, too. They came from other places.",
   "How did these fish get into the river? Some people {release} fish into rivers. Some people do not want their {pet} fish anymore. These fish {can} grow big and have many babies. They eat the native fish's food and take their homes.",
   "This year, a {research} team used {scuba} diving in the river for the first time. Big invasive fish lay eggs in deep {pool}s. From the riverbank, people {can't} catch them easily, but divers {can} swim right down to them. The team took out 371 invasive fish.",
   "The native fish need our help. One {rare} fish in the Beishi River is only about 3 centimeters long!",
   "So what {should} we do? The city says people {shouldn't} release fish into rivers. We {should} take good care of our pets. And before we let any animal go, we {must} think about nature first!"],
  words:[
   ["native","adj.","原生的、本地的","The Formosan black bear is native to Taiwan."],
   ["invasive","adj.","外來入侵的","Invasive plants can grow very fast."],
   ["release","v.","放走、放生","Please don't release your pet into the wild."],
   ["pet","n.","寵物","My pet cat sleeps all day."],
   ["research","n.","研究","Scientists do research on rivers."],
   ["scuba","n.","水肺潛水（背著氣瓶潛水）","She learned scuba diving in Kenting."],
   ["pool","n.","水潭、水池","There is a deep pool under the waterfall."],
   ["rare","adj.","稀有的、少見的","This rare bird lives only in the mountains."]],
  grammar:{name:"情態助動詞 can／must／should",
   intro:"情態助動詞放在動詞前面，表示「能力」「必須」「建議」。後面的動詞一律用原形，而且不管主詞是誰，助動詞都不加 -s。例：Divers can swim right down to them.",
   task:"用 can、must、should 各寫一句話，例如寫寫你家或班上的規定：We must not run in the classroom.",
   cols:[
    [{h:"1. 三個好朋友：意思不一樣",head:["助動詞","意思","例句"],rows:[["can","能夠、會（能力）","Divers can swim very deep."],["must","必須、一定要（規定）","We must keep the river clean."],["should","應該（建議）","You should take care of your pet."]],bold:0},
     {h:"2. 句型：主詞＋助動詞＋原形動詞",head:["✗ 錯誤","✓ 正確"],rows:[["She can swims.","She can swim."],["He musts go.","He must go."],["They should to stop.","They should stop."]],bold:1}],
    [{h:"3. 否定：後面加 not",head:["完整","縮寫","意思"],rows:[["cannot","can't","不能、不會"],["must not","mustn't","絕對不可以（禁止）"],["should not","shouldn't","不應該"]],bold:1},

 id:"2026-11-25-beaver-supermoon",no:4,date:"2026-11-25",cat:"科學・天文",level:"國小高年級～國中",
 zh:{level:"國小高年級",edition:"中文・國小版",len:"約 500 字・閱讀約 4 分鐘",kicker:"科學・天文｜全球",title:"月亮變大了？今年第一個超級月亮登場！",
  deck:"11 月 24 日晚上的滿月，是今年第一個「超級月亮」，旁邊還有一群小星星陪著它。12 月 24 日平安夜，還有一次更大的喔！",
  caption:"插圖：又大又圓的超級月亮掛在夜空，旁邊有一小群閃亮的星星；河邊的海狸正忙著蓋水壩。",
  note:"讀完後想一想：月亮本身並沒有變大，為^1什^2麼看起來會比較大？畫線的詞語，試著自己造句！",
  body:[
   "11 月 24 日晚上，你有抬頭看看天空嗎？那天的滿月，是今年第一個「超級月亮」！台北市立天文科學教育館說，這種月亮看起來比平常更^1大、更^1{明亮}。而且那天晚上，月亮旁邊還有一群小星星{陪伴}著它，畫面非常美麗。",
   "為^1什^2麼月亮會「變大」呢？其實月亮本身的大小並沒有改變。月亮繞著地球轉的路線不是正圓形，而是有點扁的橢圓形，所以月亮和地球的{距離}，有時遠、有時近。當滿月剛好出現在月亮離地球比較近的時候，就是「超級月亮」。",
   "月亮和地球的{平均}距離，大約是 38 萬 4 千公里；這次超級月亮的時候，大約只有 36 萬公里。近了一點，看起來就大了一點、亮了一點。不過差別並不大，如果沒有拿來比一比，很多人其實不容易{察覺}喔！",
   "在北美洲，11 月的滿月有一個可愛的名字，叫做「海狸月」。因為這個時候天氣變冷了，海狸會趁著月光，忙著{建造}水壩，準備過冬。",
   "那一群陪著月亮的小星星，是金牛座的「昴宿^2星團」。用眼睛大約能看到六、七顆亮亮的星星擠在一起，所以它還有一個好聽的名字，叫做「七姊妹星團」。",
   "錯過了也別覺得^1{可惜}！12 月 24 日平安夜，還會有一次超級月亮，而且是今年離地球最近、最大的滿月；明年 1 月 22 日也還有一次。到時候，記得^1和家人一起到戶外，找個{視野}好的地方賞月吧！"],
  words:[

   ["陪伴","ㄆㄟˊ ㄅㄢˋ","跟在旁邊，一起做伴","小狗每天陪伴爺爺^1去散步。"],
   ["距離","ㄐㄩˋ ㄌㄧˊ","兩個地方或東西之間隔開的長短","我家和學校的距離不遠。"],
   ["平均","ㄆㄧㄥˊ ㄐㄩㄣ","把多個數量加起來，再平分後得^1到的數","我們班這次考試的平均是 85 分。"],

   ["可惜","ㄎㄜˇ ㄒㄧ","覺得^1遺憾、捨不得^1","下雨不能去郊遊，真是可惜。"],
   ["視野","ㄕˋ ㄧㄝˇ","眼睛能看到的範圍","站在山頂上，視野特別好。"]],
  idioms:[
   ["眾星拱月","許多星星圍繞著月亮；比喻很多人圍在一個人身邊支持他","昴宿^2星團的小星星，就陪在月亮的旁邊","球隊得到冠^1軍後，隊長^1被隊友眾星拱月般地^1圍在中間。"],
   ["皓月當空","明亮的月亮高高掛在天空","11 月 24 日晚上，又大又亮的超級月亮","中秋節晚上皓月當空，我們全家在陽台賞月。"],
   ["一飽眼福","看到美好的事物，讓眼睛得到滿足","平安夜還有今年最大的滿月可以欣賞","花展裡有上千種花，讓遊客一飽眼福。"]],
  quiz:[
   {k:"sec",t:"一、閱讀理解"},
   {k:"mc",t:"為^1什^2麼會出現「超級月亮」？",o:["月亮本身變大了","滿月剛好出現在月亮離地球比較近的時候","天上出現了兩個月亮","太陽變得^1比較亮"],a:1,why:"文中說月亮本身的大小並沒有改變，是離地球比較近。"},
   {k:"mc",t:"月亮和地球的平均距離大約是多少？",o:["3 萬 8 千公里","38 萬 4 千公里","380 萬公里","3 千 8 百公里"],a:1},

   {k:"sel",t:"這場煙火秀又大又美，讓大家＿＿＿。",o:["眾星拱月","皓月當空","一飽眼福"],a:2},

 zhj:{level:"國中",edition:"中文・國中版",len:"約 700 字・閱讀約 6 分鐘",kicker:"科學・天文｜全球",title:"滿月為^1什^2麼有大有小？從「海狸超級月亮」看月球軌道",
  deck:"11 月 24 日，今年第一個超級滿月登場，還與金牛座的昴宿^2星團同框。月亮其實沒有變大，關鍵藏在它繞行地球的橢圓軌道裡。",
  caption:"插圖：滿月高掛夜空，昴宿^2星團的星星在一旁閃爍；河岸邊，海狸趁著月光修築水壩。",
  note:"讀完後想一想：除了超級月亮，你還知道哪些和月亮有關的天文現象（例如月相變化、月食）？試著用文中「軌道」的概念解釋看看。",
  body:[
   "11 月 24 日晚間，今年第一個「超級滿月」{現身}夜空。台北市立天文科學教育館表示，超級滿月是指滿月時月球恰好離地球較近，月面看起來較大，也更明亮。同一天，月球還行經金牛座的昴宿^2星團附近，上演月亮與星團「同框」的景象。",
   "月亮為^1什^2麼會忽大忽小？答案藏在它的軌道裡。月球繞行地球的軌道並非正圓，而是略扁的{橢圓}，因此地球與月球的距離會{週期}性地^1變化：最接近地球的位置稱為「近地點」，最遠的位置則是「遠地點」。當滿月恰好發生在近地點附近，就是一般所說的超級月亮。",
   "根據美國科學媒體《Live Science》的資料，地球與月球的平均距離約 38 萬 4 千公里，而這次滿月時，月球距離地球約 36 萬 1 千公里。距離縮短，月亮在天空中便顯得^1稍大、稍亮；不過這樣的差異相^1當{細微}，若沒有並排比較，單憑肉眼並不容易{分辨}。",
   "這次的滿月在北美洲又被稱為「海狸月」。依照當地傳統，11 月正是夜行性的海狸趁著月光{修築}水壩、準備過冬的時節，人們便以此為滿月命名。同晚與月亮相^1伴的昴宿^2星團，則是由許多年輕恆星組成的疏散星團，肉眼大約能看見六、七顆星，因而有「七姊妹星團」的別稱。",
   "如果錯過了也不必{遺憾}。12 月 24 日平安夜將再迎來一次超級滿月，而且是今年最大的滿月，屆時月球距離地球約 35 萬 7 千公里；明（2027）年 1 月 22 日的滿月，則是明年最大的滿月。此外，天文館也提醒，11 月 22 日至 12 月 5 日的日出前，東方天空可以看到今年亮度最高的金星，肉眼就能輕鬆辨認。",
   "欣賞天文現象不一定需要昂貴的器材，只要抬起頭，就能親眼{見證}宇宙的運行。下一次滿月高掛時，不妨放下手機，好好看看這位陪伴地球四十多億年的老朋友。"],
  words:[
   ["現身","ㄒㄧㄢˋ ㄕㄣ","出現、露^1面","失蹤多日的小貓，今天終於在巷口現身。"],
   ["橢圓","ㄊㄨㄛˇ ㄩㄢˊ","像雞蛋側面那樣，長長扁扁的圓形","操場的跑道是橢圓形的。"],
   ["週期","ㄓㄡ ㄑㄧˊ","事物重^1複出現一次所需要的時間","月亮圓缺變化的週期大約是一個月。"],
   ["細微","ㄒㄧˋ ㄨㄟˊ","非常小、不容易看出來","這兩張圖只有細微的差別。"],
   ["分辨","ㄈㄣ ㄅㄧㄢˋ","辨別、區分清楚","雙胞胎兄弟長^1得^1太像，連老師都很難分辨。"],
   ["修築","ㄒㄧㄡ ㄓㄨˋ","建造（道路、橋梁、堤防等）","古人花了許多年修築這道城牆。"],
   ["遺憾","ㄧˊ ㄏㄢˋ","因為沒能做到而覺得^1可惜","沒能參加畢業旅行，是他最大的遺憾。"],
   ["見證","ㄐㄧㄢˋ ㄓㄥˋ","親眼看到，可以為^1某件事作證","這棵老樹見證了小鎮百年來的變化。"]],
  idioms:[
   ["陰晴圓缺","月亮有時被雲遮住、有時明亮，有時圓、有時缺；比喻事物的變化或人生的聚散","月亮不只有圓缺，連大小、亮度也會隨距離而改變","人生難免有陰晴圓缺，重要的是學會面對變化。"],
   ["眾星拱月","群星環繞著月亮；比喻眾人擁護一個人，或許多事物圍繞著一個中心","昴宿^2星團的星星伴在超級滿月旁","頒獎典禮上，新任隊長^1在隊友眾星拱月下走上台。"],
   ["稍縱即逝","稍微一放鬆就消失了；形容時機或景象非常短暫","金星最亮的時期只有短短兩週","比賽中得分的機會稍縱即逝，必須全神貫注。"],
   ["斗轉星移","北斗轉向、星辰移位；表示時間流逝、季節變換","月球沿著軌道運行，夜空的景象隨時間改變","斗轉星移，轉眼間我們就要從國中畢業了。"]],
  quiz:[
   {k:"sec",t:"一、閱讀理解"},
   {k:"mc",t:"根據第二段，超級月亮形成的主要原因是什^2麼？",o:["滿月恰好發生在近地點附近","月球的體積在冬天會變大","地球的大氣把月亮放大了","月球軌道是正圓形"],a:0},
   {k:"mc",t:"根據第三段的數字，這次滿月時，月球比平均距離近了大約多少公里？",o:["約 2 千公里","約 2 萬多公里","約 10 萬公里","約 74 萬公里"],a:1,why:"38 萬 4 千 − 36 萬 1 千 ＝ 約 2 萬 3 千公里。"},
   {k:"mc",t:"關於「昴宿^2星團」，下列敘述何者正確？",o:["位在金牛座，又稱「七姊妹星團」","是一顆非常明亮的行星","只有在白天才看得到","位在獵戶座"],a:0},
   {k:"mc",t:"下列哪一個日期「不是」文中提到的超級滿月？",o:["2026 年 11 月 24 日","2026 年 12 月 24 日","2027 年 1 月 22 日","2026 年 12 月 5 日"],a:3,why:"12 月 5 日是文中提到看金星的最後一天。"},
   {k:"sec",t:"二、詞語選填"},
   {k:"sel",t:"這兩種蘑菇長^1得^1很像，一般人很難＿＿＿哪一種有毒。",o:["分辨","修築","現身"],a:0},
   {k:"sel",t:"兩張照片只有＿＿＿的差別，要仔細看才找得^1到。",o:["遺憾","細微","週期"],a:1},
   {k:"sel",t:"這座百年車站＿＿＿了城市的發展。",o:["見證","橢圓","現身"],a:0},
   {k:"sec",t:"三、成語選填"},
   {k:"sel",t:"人生難免有＿＿＿，學會面對才能成長^1。",o:["陰晴圓缺","眾星拱月","稍縱即逝","斗轉星移"],a:0},
   {k:"sel",t:"流星劃過天空的畫面＿＿＿，一眨眼就不見了。",o:["陰晴圓缺","眾星拱月","稍縱即逝","斗轉星移"],a:2},
   {k:"sec",t:"四、想一想"},
   {k:"open",t:"文章最後建議「放下手機，好好看看月亮」。你認為親眼觀察天空，和在網路上看照片有什^2麼不同？請說明你的想法。"}]},
 en:{level:"國小高年級～國中",edition:"English Edition",len:"About 180 words・CEFR A2",kicker:"Science・Space",title:"A Supermoon Lights Up the Sky",
  deck:"On November 24, people saw the first supermoon of the year. The moon looked a little bigger and brighter than usual.",
  caption:"Illustration: A big full moon shines near a group of stars. A beaver works by the river.",
  note:"螢光筆畫的是生詞，畫底線的是最高級（the -est／the most）。上一期學了比較級，這一期升級成「最」！",
  body:[

   cols:[

 zhj:{level:"國中",edition:"中文・國中版",len:"約 600 字・閱讀約 5 分鐘",kicker:"科學・環境｜台灣",title:"讓「海底草原」重^1生：泰來草人工繁殖的突破",
  deck:"台灣近海海草已消失約三分之一。水產試驗所歷經兩年半，首度在人工環境中完成泰來草的人工授粉與結^1果，為^1海草床復育與藍碳帶來新希望。",
  caption:"插圖：陽光穿過海水，照在一片海草床上；魚群與螃蟹在其中棲息、覓食。",

  body:[
   "提到減碳，多數人第一個想到的是種^1樹；但在海平面以下，還有一片{默默}工作的「海底草原」。11 月 23 日，農業部水產試驗所發表一項成果：研究團隊首度在人工環境中，以人工授粉讓「泰來草」結^1出果實、取得種子，為^1海草床的{復育}{奠定}重要基礎。",
   "海草並不是海藻。它是能在海水中生活的開花植物，和陸地上的植物一樣會開花、結^1果。成片生長^1的海草床，是魚、蝦、蟹、貝類重要的{棲地}與育幼場，同時還能吸收並儲存碳、淨化水質、保護海岸，功能相^1當多元。",
   "然而，長期以來國際研究多半聚焦於海藻，海草的價值較少受到重視。全球的海草床正因棲地流失與沿海開發，{面臨}消失的危機；在台灣，近海海草已消失約三分之一。也因此，復育海草床被列為「台灣 2050 淨零轉型」中自然碳匯的重點項目之一。",

   "為^1什^2麼「種子」如此重要？有了穩定的種源，才能大量{培育}幼苗，不必一再到野外採集，也為^1日後大規模復育做好準備。水試所表示，未來將持續改良泰來草的繁殖與育苗技術，並與研究機構、企業、民間團體及學校合作，推動海草床復育、環境教育與生態旅遊。",
   "這些長^1在海底、看似{不起眼}的綠色植物，其實是海洋生態與氣候行動中的重要角色。守護海洋，不只是撿起沙灘上的寶特瓶，也包括看見那些過去被我們忽略的生命。"],

   ["培育","ㄆㄟˊ ㄩˋ","培養、養育，使其成長^1","這間實驗室專門培育新品種的稻米。"],

 en:{level:"國小高年級～國中",edition:"English Edition",len:"About 180 words・CEFR A2",kicker:"Science・Taiwan",title:"A Big First for Seagrass in Taiwan",
  deck:"For the first time in Taiwan, scientists got seagrass seeds in a lab. The seeds can help bring back the meadows under the sea.",
  caption:"Illustration: Sunlight shines on a seagrass meadow. Small fish and a crab live there.",
  note:"螢光筆畫的是生詞，畫底線的是比較級（-er／more）。讀完後，用比較級比一比你和家人吧！",
  body:[
   "Did you know there are meadows under the sea? Seagrass grows in {shallow} water near the {coast}. It is not seaweed. Seagrass is a real {plant}. It has {flower}s, fruits, and {seed}s.",
   "Seagrass is very important. Fish, shrimp, crabs, and shellfish live in it. Seagrass also takes in {carbon} and makes the water {cleaner}. But a lot of it is gone. Near Taiwan's coast, about one third of the seagrass has {disappear}ed.",
   "Taiwan has 13 kinds of seagrass. Scientists at the Fisheries Research Institute chose one kind. Its plants are {bigger} than many others, and it is {easier} to {collect}.",
   "The scientists worked on it for two and a half years. They moved {pollen} from the male flowers to the female flowers by hand. At last, the plants made fruits. The fruits opened, and there were seeds inside! This was a first for Taiwan.",
   "With seeds, scientists can grow {more} young plants and put them back into the sea. One day, the meadows under the sea may be {greener} and {healthier} than they are today!"],
  words:[
   ["shallow","adj.","淺的","The kids played in the shallow water."],
   ["coast","n.","海岸","We drove along the coast."],
   ["plant","n.","植物","I water the plants every morning."],
   ["flower","n.","花","Bees love yellow flowers."],
   ["seed","n.","種子","She put a sunflower seed in the soil."],
   ["carbon","n.","碳","Trees take in carbon from the air."],
   ["disappear","v.","消失","The sun disappeared behind the clouds."],
   ["collect","v.","採集、收集","My brother collects stamps."],
   ["pollen","n.","花粉","Bees carry pollen on their legs."]],
  grammar:{name:"比較級 Comparatives",
   intro:"比較兩樣東西時，形容詞要變成比較級，後面常接 than。例：Its plants are bigger than many others.",
   task:"用比較級寫一句話，比較兩種動物或植物，例如：A whale is bigger than a fish.",
   cols:[
    [{h:"1. 短的形容詞：加 -er",head:["規則","原級","比較級"],rows:[["一般加 -er","clean、green","cleaner、greener"],["字尾是 e，只加 -r","large、nice","larger、nicer"],["短母音＋一個子音：重複字尾＋-er","big、hot","bigger、hotter"],["子音＋y：y 改 i＋-er","easy、healthy","easier、healthier"]],bold:2},
     {h:"3. 不規則變化：要背起來",head:["原級","比較級","中文"],rows:[["good","better","比較好"],["bad","worse","比較差"],["many／much","more","比較多"]],bold:1}],
    [{h:"2. 長的形容詞：前面加 more",head:["原級","比較級"],rows:[["important","more important"],["beautiful","more beautiful"],["interesting","more interesting"]],bold:1},
     {h:"4. 句型：A＋be＋比較級＋than＋B",rows:[["肯定","A whale is bigger than a fish."],["問句","Is a cat smaller than a dog?"],["用 more","This book is more interesting than that one."]]},
     {h:"5. 新聞裡的比較級",p:"Its plants are <b>bigger</b> than many others.<br>It is <b>easier</b> to collect.<br>The meadows may be <b>greener</b> and <b>healthier</b>."}]]},
  quiz:[
   {k:"sec",t:"A. Reading — True or False"},
   {k:"mc",t:"Seagrass is a kind of seaweed.",o:["True","False"],a:1,why:"Seagrass is a real plant with flowers and seeds."},
   {k:"mc",t:"Fish and crabs live in seagrass.",o:["True","False"],a:0},
   {k:"mc",t:"Taiwan has 30 kinds of seagrass.",o:["True","False"],a:1,why:"Taiwan has 13 kinds."},
   {k:"mc",t:"The scientists worked for two and a half years.",o:["True","False"],a:0},
   {k:"sec",t:"B. Vocabulary — Choose the word"},
   {k:"sel",t:"The water here is ___. You can see the sand.",o:["shallow","carbon","pollen"],a:0},
   {k:"sel",t:"Bees carry ___ from flower to flower.",o:["seed","pollen","coast"],a:1},
   {k:"sel",t:"I like to ___ shells on the beach.",o:["collect","disappear","plant"],a:0},
   {k:"sec",t:"C. Grammar — Write the comparative"},
   {k:"txt",t:"An elephant is ___ (big) than a dog.",a:"bigger"},
   {k:"txt",t:"This test is ___ (easy) than the last one.",a:"easier"},
   {k:"txt",t:"My new bike is ___ (fast) than my old one.",a:"faster"},
   {k:"txt",t:"This book is ___ (interesting) than that one.",a:"more interesting"},
   {k:"sec",t:"D. Write"},
   {k:"open",t:"Compare two animals or plants. Write 2–3 sentences with comparatives."}]},
 sources:[["中央社","https://www.cna.com.tw/news/ahel/202611230211.aspx"],["新頭殼（Yahoo 新聞）","https://tw.news.yahoo.com/%E6%B5%B7%E5%BA%8A%E5%BE%A9%E8%82%B2%E6%9C%89%E6%9C%9B-%E6%B0%B4%E8%A9%A6%E6%89%80%E7%AA%81%E7%A0%B4%E6%B3%B0%E4%BE%86%E8%8D%89%E6%9C%89%E6%80%A7%E7%94%9F%E6%AE%96%E6%8A%80%E8%A1%93-092344104.html"]]

 zh:{level:"國小高年級",edition:"中文・國小版",len:"約 500 字・閱讀約 4 分鐘",kicker:"生活・美食｜高雄",title:"大明星的新任務：吃遍台灣小吃！",
  deck:"Super Junior 的始源在高雄拍電影，空^1閒時間就變身美食探險家，第一站是一家四十多年的牛肉麵老店。",
  caption:"插圖：熱騰騰的牛肉麵和皮蛋豆腐，旁邊是一支準備拍照記錄的手機。",
  note:"讀完後想一想：如果始源來你住的地方，你會推薦他吃什^2麼？為^1什^2麼？畫線的詞語，試著自己造句！",
  body:[
   "如果你正在牛肉麵店吃晚餐，一抬頭，發現隔壁桌坐著韓國大明星，你會有什^2麼反應^1？11 月 12 日晚上，這件事真的在高雄發生了！",
   "這位明星是 Super Junior 的始源。他最近在高雄拍電影，會在這裡{停留}一段時間。不用工作的時候，他最愛做的事只有一件——找好吃的！這一次，他沒有告訴任何人，悄悄走進苓雅區一家開了四十多年的牛肉麵店。",
   "大塊牛肉的湯麵、鋪滿青菜的乾拌麵、炒空心菜，再來一盤皮蛋豆腐——始源一口接一口，吃得^1津津有味。吃飽後，他用中文在網路上寫下「在台灣的新發現」，開心地^1說這次的{探索}成功了！",
   "更^1讓粉絲尖叫的是，他還{宣布}了一個新任務：要和工作人員四處^1{打聽}，把台灣各地藏在巷子^1裡的隱藏版美食一家一家吃過，而這碗牛肉麵，就是任務的第一站。",
   "消息一傳開，連高雄市長^1都跑來留言，誇他很懂吃，還{推薦}他下次加點酸菜辣椒。後來，始源又跑到台南，{品嘗}一家開了六十五年的沙茶火鍋老店。有些高雄人看了又驕傲又緊張，開玩笑說自己的私房愛店一家一家被找到，以後恐怕要排隊排到腿痠啦！",
   "一碗{道地}的牛肉麵，讓世界各地的粉絲都「聞」到了台灣小吃的香味。其實，每個人的{家鄉}都藏著這樣的美味寶藏^1。換你當小導遊——你會帶始源去吃哪一家呢？"],
  words:[

   ["品嘗","ㄆㄧㄣˇ ㄔㄤˊ","仔細地^1吃，感受食物的味道","爺爺^1慢慢品嘗剛泡好的熱茶。"],
   ["道地","ㄉㄠˋ ㄉㄧˋ","真正是當地的做法或口味","這家店賣的是道地的台南碗粿。"],
   ["家鄉","ㄐㄧㄚ ㄒㄧㄤ","自己出生、長^1大的地方","爸爸^1的家鄉在花蓮，那裡有很美的海。"]],
  idioms:[
   ["津津有味","吃得^1很香、很有味道；也形容很有興^1趣","始源吃牛肉麵和皮蛋豆腐","弟弟^1把媽媽^1做的炒飯吃得^1津津有味。"],
   ["名不虛傳","名聲和實際情形一樣好，不是隨便說說的","開了四十多年的老店，連市長^1都稱讚","這座夜市果然名不虛傳，每一攤都好好吃。"],

 zhj:{level:"國中",edition:"中文・國中版",len:"約 850 字・閱讀約 6 分鐘",kicker:"生活・美食｜高雄",title:"從一碗牛肉麵出發：始源的「台灣新發現」",
  deck:"在高雄拍片的韓星始源，走進經營四十多年的牛肉麵店，宣布要尋訪全台隱藏美食；一則貼文，意外讓在地小吃成為焦點。",
  caption:"插圖：一碗牛肉麵、一盤皮蛋豆腐，和一支準備記錄美食的手機。",
  note:"讀完後想一想：高雄網友一邊開心、一邊擔心，他們在擔心什^2麼？你認為名人推薦對小店是好事還是壞事？",
  body:[
   "大明星來台灣，多半是為^1了開演唱會；但最近 Super Junior 成員始源最受關注的，卻是他的「吃」。今年{頻繁}來台的他，這次是因為^1拍攝電影而在高雄停留；不過工作之餘，他的腳步總會不知不覺走向台灣的街頭小吃。",
   "11 月 12 日晚間，沒有預告、沒有排場，始源走進高雄苓雅區一間經營超過四十年的牛肉麵店。肉塊厚實的湯麵、鋪滿青菜的乾拌麵、一盤炒空心菜，再配上皮蛋豆腐——標準的台式晚餐。飯後，他在社群平台用中文寫下「在台灣的新發現」，宣告第一次探索圓滿成功。",
   "這篇貼文，其實更^1像一封「挑戰書」：始源宣布，將和工作人員四處^1打聽，親自{尋訪}台灣各地的隱藏小店。連高雄市長^1都忍不住在底下留言，稱讚他「懂吃」，還附上私房吃法——加點酸菜辣椒，味道會更^1有{層次}。",
   "接下來，他的美食地圖一路延伸：台南一家六十五年的{老字號}沙茶火鍋、高雄巷弄^1裡的蒸餃店……每當足跡{曝光}，粉絲便循線而來，店門口很快湧現人潮。",
   "對此，高雄網友的心情可說是又喜又憂。有人在社群上半開玩笑地^1抱怨，私藏多年的愛店接連被「發掘」，以後恐怕得^2排很久的隊；也有人樂觀地^1認為，國際明星的推薦能{帶動}在地商家的生意，讓台灣小吃被更^1多人看見。",
   "不過，明星的光環來得^1快，也去得^1快。真正讓這些{道地}老店{屹立}數十年的，從來不是名人，而是店家日復一日對味道的堅持，以及街坊鄰居一碗接一碗的支持。下次經過巷口的小店，不妨也當一回美食偵探吧！"],
  words:[
   ["頻繁","ㄆㄧㄣˊ ㄈㄢˊ","次數很多，接連不斷","最近地震頻繁，大家要多注意安全。"],
   ["尋訪","ㄒㄩㄣˊ ㄈㄤˇ","到各處^1去尋找、拜訪","作家走遍鄉間，尋訪老一輩的故事。"],
   ["層次","ㄘㄥˊ ㄘˋ","內容的深淺與變化","這道湯加了香料，味道更^1有層次。"],
   ["老字號","ㄌㄠˇ ㄗˋ ㄏㄠˋ","開了很久、很有名氣的商店","這家餅店是當地的老字號，已經傳了三代。"],
   ["曝光","ㄆㄨˋ ㄍㄨㄤ","原指底片照到光；比喻隱密的事被公開","新手機的設計圖提早曝光了。"],
   ["帶動","ㄉㄞˋ ㄉㄨㄥˋ","引導、促使跟著發展","新捷運站帶動了附近的商圈。"],
   ["道地","ㄉㄠˋ ㄉㄧˋ","真正是當地的、正宗的","這碗擔^1仔^1麵是道地的台南口味。"],
   ["屹立","ㄧˋ ㄌㄧˋ","像山一樣穩固地^1站立；比喻長久不倒","這座古廟在風雨中屹立了兩百年。"]],
  idioms:[
   ["畫龍點睛","比喻在關鍵的地方加上一筆，使整體更^1生動","市長^1建議加酸菜辣椒提味","結尾這句話畫龍點睛，讓整篇作文更^1有力量。"],
   ["大排長龍","形容排隊的人很多，像一條長龍","網友擔心愛店以後要排很久的隊","新開的冰店天天大排長龍。"],
   ["慕名而來","因為^1仰慕名聲而前來","粉絲循著始源的足跡到店用餐","許多遊客慕名而來，只為^1看一眼這片花海。"],

  quiz:[

   {k:"mc",t:"始源的「台灣新發現」計畫指的是什^2麼？",o:["在台灣開餐廳","尋訪台灣各地隱藏的美食小店","推出新的便利商店商品","學習台灣料理"],a:1},
   {k:"mc",t:"第五段說高雄網友「又喜又憂」，原因是什^2麼？",o:["既高興^1小店被看見，又擔心以後要排很久的隊","不喜歡外國明星","擔心食物變難吃","店家要漲價"],a:0},
   {k:"mc",t:"最後一段，作者認為讓老店長久經營的關鍵是什^2麼？",o:["名人的推薦","網路廣告","店家對味道的堅持與鄰居的支持","便^1宜的價格"],a:2},
   {k:"sec",t:"二、詞語選填"},

   {k:"sel",t:"畫面角落加上一隻飛鳥，有＿＿＿的效果。",o:["畫龍點睛","大排長龍","慕名而來","名不虛傳"],a:0},

 en:{level:"國小高年級～國中",edition:"English Edition",len:"About 200 words・CEFR A2",kicker:"Food・Kaohsiung",title:"Siwon's Taiwan Food Adventure",
  deck:"Super Junior's Siwon is making a movie in Kaohsiung. His next big job? Finding hidden food all over Taiwan!",
  caption:"Illustration: Beef noodles, tofu with century eggs, and a phone ready to take photos.",
  note:"螢光筆畫的是生詞，畫底線的是 be going to（打算、將要）。讀完後，用 be going to 說說你週末要做什麼！",
  body:[
   "What do you do when you visit a new city? Siwon from the K-pop group Super Junior eats! He is {stay}ing in Kaohsiung to make a {movie}. In his free time, he looks for good food.",
   "On November 12, he walked into a beef noodle shop. The shop is more than 40 years old. Beef noodles, vegetables, tofu with century eggs... yum! Siwon said the food was really {delicious}.",
   "Then he shared a big plan in Chinese. He {is going to} {explore} Taiwan with his team. They {are going to} ask {local} people about {hidden} food places. The beef noodle shop was stop number one!",
   "Even the mayor of Kaohsiung wrote a comment. He said Siwon really knows good food. He also {suggest}ed adding pickled vegetables and chili next time.",
   "Some people in Kaohsiung are laughing and worrying at the same time. Their {secret} food places are not secret anymore! Soon, more fans {are going to} {line up} at these shops. Where {are} you {going to} take Siwon next?"],
  words:[
   ["stay","v.","停留、暫住","We stayed at a hotel near the beach."],
   ["movie","n.","電影","Let's watch a movie tonight."],
   ["delicious","adj.","美味的","Mom's dumplings are delicious."],
   ["explore","v.","探索","The kids explored the old street."],
   ["local","adj.","當地的","Try the local food when you travel."],
   ["hidden","adj.","隱藏的","There is a hidden door behind the shelf."],
   ["suggest","v.","建議","The teacher suggested a good book."],
   ["secret","adj.","祕密的","This is my secret place to read."],
   ["line up","phr.","排隊","Please line up for lunch."]],
  grammar:{name:"未來式 be going to",
   intro:"說「已經計畫好、打算要做」的事，用 be going to＋原形動詞。例：He is going to explore Taiwan.",
   task:"用 be going to 寫一句你這個週末要做的事，例如：I am going to visit my grandma.",
   cols:[
    [{h:"1. 句型：主詞＋be 動詞＋going to＋原形動詞",head:["主詞","be 動詞","例句"],rows:[["I","am","I am going to eat noodles."],["He / She / It","is","He is going to explore Taiwan."],["We / You / They","are","They are going to ask local people."]]},
     {h:"3. 常搭配的時間詞",p:"tomorrow、tonight、this weekend、next week、next time"}],
    [{h:"2. 否定句和問句",rows:[["否定：be 後面加 not","He is not going to stay at home."],["問句：be 動詞放句首","Are you going to try beef noodles?"],["簡答","Yes, I am. / No, I'm not."]]},
     {h:"4. 新聞裡的 be going to",p:"He <b>is going to</b> explore Taiwan with his team.<br>They <b>are going to</b> ask local people.<br>More fans <b>are going to</b> line up at these shops."}]]},
  quiz:[
   {k:"sec",t:"A. Reading — True or False"},
   {k:"mc",t:"Siwon is making a movie in Kaohsiung.",o:["True","False"],a:0},
   {k:"mc",t:"The beef noodle shop is new.",o:["True","False"],a:1,why:"It is more than 40 years old."},
   {k:"mc",t:"Siwon wrote his post in Chinese.",o:["True","False"],a:0},
   {k:"mc",t:"The mayor did not like Siwon's post.",o:["True","False"],a:1,why:"He said Siwon really knows good food."},
   {k:"sec",t:"B. Vocabulary — Choose the word"},
   {k:"sel",t:"This cake is ___. I want another piece!",o:["delicious","hidden","local"],a:0},
   {k:"sel",t:"Please ___ at the door and wait for your turn.",o:["line up","explore","suggest"],a:0},
   {k:"sel",t:"The treasure is ___ under the sand.",o:["hidden","movie","stay"],a:0},
   {k:"sec",t:"C. Grammar — Use be going to"},
   {k:"txt",t:"I ___ (visit) my grandma this weekend.",a:"am going to visit"},
   {k:"txt",t:"She ___ (eat) beef noodles tonight.",a:"is going to eat"},
   {k:"txt",t:"They ___ (play) basketball tomorrow.",a:"are going to play"},
   {k:"txt",t:"He ___ (take) photos of the food.",a:"is going to take"},
   {k:"sec",t:"D. Write"},
   {k:"open",t:"What are you going to do this weekend? Write 2–3 sentences with \"be going to\"."}]},

  body:[
   "韓國人氣男團 BTS（防彈少^1年團）在 11 月 19、21、22 日，到高雄世運主場館舉辦三場演唱會。這是他們{相^1隔} 8 年再次來台灣表演，也是這次亞洲{巡迴}的第一站。為^1了歡迎他們，高雄的 85 大樓、愛河等地都亮起了 BTS 的代表色——紫色，有些路口的行人號誌甚至顯示「ARMY Go」，ARMY 就是 BTS 粉絲的名稱。",
   "11 月 20 日是演唱會中間的休息日。成員柾國、Jimin 和 j-hope 趁著{空^1檔}走進高雄的大街小巷。他們去了駁二藝術特區，搭過輕軌，也到旗津的海邊吹風，還在一家開了七十多年的老店吃早餐、喝紅茶牛奶。",
   "柾國一邊逛，一邊用手機和相機記錄看到的風景。當天晚上他親自{剪輯}，在 21 日凌晨把一支約 2 分鐘的影片上傳到 Instagram，標題是「在高雄的空^1閒時間」。影片用溫暖的{復古}色調^1，拍下腳踏車、機車、中文招牌和老街巷。背景音樂^1也很用心，選的是台灣吉他{演奏家}董運昌的作品〈碧海藍天〉。",
   "影片裡還有一個讓人感動的畫面：許多粉絲雖然很想靠近偶像，卻自動站在一條看不見的線外，安靜又有{秩序}地等候。不少外國網友看了，都稱讚台灣粉絲很有禮貌。",
   "這支影片上傳大約 10 小時，就有超過 300 萬人按讚，觀看次數超過 2000 萬。高雄市長^1也用韓文留言道謝。許多網友開玩笑說，這是高雄「最貴」的城市{宣傳}片。",
   "一支用心拍的小影片，讓世界各地的人重^1新認識了高雄。原來，我們每天走過的街道，在別人眼中也可以這麼美。"],

 zhj:{level:"國中",edition:"中文・國中版",len:"約 750 字・閱讀約 6 分鐘",kicker:"文化・城市｜高雄",title:"一支 Vlog 的城市魅力：柾國鏡頭下的高雄",
  deck:"韓團 BTS 睽違八年來台開唱，成員柾國利用休息日拍下的高雄影片，意外成為全球矚目的城市宣傳。",
  caption:"插圖：紫色燈光下的高雄港邊。演唱會前，85 大樓、愛河、大港橋等地標陸續點亮紫色。",
  note:"讀完後想一想：作者為^1什^2麼說「真誠的分享」也有影響力？試著找出文章裡支持這個說法的證據。",
  body:[
   "11 月 19 日起，韓國男團 BTS 在高雄世運主場館一連舉辦三場《ARIRANG》世界巡迴演唱會。這不只是他們{睽違}八年再度來台，高雄更是這次亞洲巡演的首站。演唱會前，85 大樓、愛河、大港橋等地標陸續點亮紫色燈光，部分^1行人號誌也換上「ARMY Stop」「ARMY Go」的字樣，整座城市以實際行動，向這群遠道而來的歌手表達歡迎。",
   "兩場演唱會之間的 20 日是休息日，柾國、Jimin 和 j-hope 走出飯店，在港都^1街頭{漫遊}。他們走訪駁二藝術特區、搭乘輕軌、到旗津海岸看海，也坐進一家經營超過七十年的老店，點了蛋餅和紅茶牛奶，像一般旅客一樣體驗在地生活。",
   "當天深夜，柾國把自己用手機和相機拍下的片段，剪輯成一支兩分多鐘的 Vlog，在 21 日凌晨發布於 Instagram，命名為「在高雄的空^1閒時間」。影片以暖黃的復古色調^1，呈現腳踏車、機車、壁掛電風扇與中文招牌，畫面平凡，卻充滿台灣的{感性}。最令人驚喜的是配樂^1：他選用台灣吉他演奏家董運昌 2002 年的作品〈碧海藍天〉，讓影像與音樂^1相^1互呼應^1，處^1處^1可見{細膩}的巧思。",
   "影片中還有一幕引起廣泛討論：大批粉絲雖然聚集在路旁，卻{自發}地站在一條看不見的界線外，安靜而有秩序地^1等候。不少海外網友留言稱讚，認為這展現了台灣粉絲的素養。",
   "這支影片發布約十小時，按讚數便突破三百萬，觀看次數超過兩千萬，迅速成為國際{矚目}的焦點。高雄市長^1以韓文留言致謝；網友則笑稱，這是高雄「成本最高的城市宣傳片」，因為^1拍攝者是國際巨星。影片曝光後，許多粉絲依照畫面中的店家與景點前往{朝聖}，讓這些地方的人潮明顯增加。",
   "一般的觀光{行銷}往往需要大筆預算，這支影片卻證明，真誠的觀察與分享，同樣具有強大的影響力。當我們用旅人的眼光重^1新看待身邊的街道，或許也會發現：那些習以為常的日常風景，正是一座城市最動人的地方。"],
  words:[
   ["睽違","ㄎㄨㄟˊ ㄨㄟˊ","分離、相^1隔（多指時間很久）","睽違十年，他終於回到故鄉。"],
   ["漫遊","ㄇㄢˋ ㄧㄡˊ","沒有固定目的，隨意地^1遊覽","週末我們在老街漫遊了一整個下午。"],
   ["感性","ㄍㄢˇ ㄒㄧㄥˋ","帶有情感、讓人有感觸的特質","這部電影充滿感性，看得^1我眼眶泛紅。"],
   ["細膩","ㄒㄧˋ ㄋㄧˋ","細緻周到，連小地方都注意到","她的文筆細膩，描寫得^1非常生動。"],
   ["自發","ㄗˋ ㄈㄚ","出於自己的意願，不是被要^1求","同學們自發地^1留下來整理教室。"],
   ["矚目","ㄓㄨˇ ㄇㄨˋ","注視、特別受到重視","這場決賽受到全國矚目。"],

 en:{level:"國小高年級～國中",edition:"English Edition",len:"About 220 words・CEFR A2",kicker:"Culture・Kaohsiung",title:"Jungkook's Video Shows Kaohsiung to the World",
  deck:"On his day off, BTS member Jungkook filmed Kaohsiung with his phone. Millions of people watched it in one day.",
  caption:"Illustration: Kaohsiung harbour in purple light. The city lit up its landmarks for BTS.",
  note:"畫底線的是過去式動詞，螢光筆畫的是生詞。讀完後，用過去式說說你昨天做了什麼！",
  body:[
   "BTS, a famous K-pop group from Korea, came to Taiwan in November. They {held} three {concert}s at Kaohsiung National Stadium. It was their first time in Taiwan in eight years. The city {welcomed} them with purple lights on tall buildings and along the Love River.",
   "November 20 was a day off. Jungkook, Jimin, and j-hope {walked} around the city. They {visited} the Pier-2 Art Center, {rode} the light rail, and {went} to the beach in Cijin. They also {ate} breakfast at a very old shop and {drank} black tea with milk.",
   "Jungkook {took} many videos with his phone and camera. That night, he {edited} them himself. Early the next morning, he {posted} a two-minute vlog on Instagram. He {called} it \"Free time in Kaohsiung.\" The video {showed} bikes, {scooter}s, old streets, and Chinese signs. For the music, he {chose} a song by a Taiwanese guitar player.",
   "In the video, many fans {stood} quietly and {waited} {in order}. People around the world {said} Taiwanese fans were very {polite}.",
   "In about ten hours, more than three million people {liked} the video. The {mayor} of Kaohsiung {thanked} Jungkook in Korean. A short video {helped} the world see how beautiful Kaohsiung is."],
  words:[
   ["concert","n.","演唱會","We went to a concert last night."],
   ["welcome","v.","歡迎","The teacher welcomed the new student."],
   ["visit","v.","拜訪、參觀","I visited my grandma on Sunday."],
   ["edit","v.","剪輯、編輯","She edited her photos before posting them."],
   ["post","v.","上傳、張貼","He posted a picture of his dog."],
   ["scooter","n.","機車","Many people in Taiwan ride scooters."],
   ["polite","adj.","有禮貌的","It is polite to say \"thank you.\""],
   ["mayor","n.","市長","The mayor opened the new park."],
   ["in order","phr.","有秩序地、按順序","Please line up in order."]],
  grammar:{name:"過去式 Simple Past",
   intro:"新聞講的是已經發生的事，所以動詞要用過去式。",
   regular:[["一般加 -ed","walk → walked、visit → visited"],["字尾是 e，只加 -d","like → liked、welcome → welcomed"],["子音＋y 結尾，y 改 i 加 -ed","study → studied"]],
   irregular:[["go","went","去"],["eat","ate","吃"],["drink","drank","喝"],["ride","rode","搭乘"],["take","took","拍、拿"],["choose","chose","選擇"],["stand","stood","站"],["hold","held","舉辦"]],
   time:"yesterday、last night、last week、in November、two days ago"},
  quiz:[
   {k:"sec",t:"A. Reading — True or False"},
   {k:"mc",t:"BTS held three concerts in Kaohsiung.",o:["True","False"],a:0},
   {k:"mc",t:"Jungkook made the video on a concert day.",o:["True","False"],a:1,why:"He made it on his day off, November 20."},
   {k:"mc",t:"The music in the video was by a Korean singer.",o:["True","False"],a:1,why:"It was by a Taiwanese guitar player."},
   {k:"mc",t:"The mayor of Kaohsiung thanked Jungkook.",o:["True","False"],a:0},
   {k:"sec",t:"B. Vocabulary — Choose the word"},
   {k:"sel",t:"My dad rides a ___ to work every day.",o:["concert","scooter","mayor"],a:1},
   {k:"sel",t:"Say \"please\" and \"thank you.\" Be ___.",o:["polite","visit","post"],a:0},
   {k:"sel",t:"The ___ is the leader of a city.",o:["scooter","concert","mayor"],a:2},
   {k:"sec",t:"C. Grammar — Write the simple past"},
   {k:"txt",t:"Last night, I (watch) ___ a vlog.",a:"watched"},
   {k:"txt",t:"We (go) ___ to the beach yesterday.",a:"went"},
   {k:"txt",t:"She (eat) ___ a sandwich for breakfast.",a:"ate"},
   {k:"txt",t:"They (take) ___ many photos in Kaohsiung.",a:"took"},
   {k:"sec",t:"D. Write"},
   {k:"open",t:"Write 2–3 sentences about a place you visited. Use the simple past."}]},
 sources:[["中央社","https://www.cna.com.tw/news/amov/202611215002.aspx"],["NOWnews","https://www.nownews.com/news/6894220"],["Korea JoongAng Daily","https://www.koreajoongangdaily.com/entertainment/bts-to-kick-off-asian-leg-of-arirang-world-tour-as-kaohsiung-turns-purple/12980830"],["TVBS English","https://news.tvbs.com.tw/english/3099823"]]
}];

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* 首頁顯示最新一期（ARTICLES[0]）；往期用 ?a=文章id 打開 */
const LATEST=ARTICLES[0];
const A=(()=>{let id=null;try{id=new URLSearchParams(location.search).get("a")}catch(e){}return ARTICLES.find(x=>x.id===id)||LATEST})();
const NUM=["零","一","兩","三","四","五","六"];
const LANGS={zh:"中文・國小",zhj:"中文・國中",en:"英文"};
const WEEK="日一二三四五六";
const dateZh=d=>{const t=new Date(d+"T00:00:00");return `${t.getFullYear()} 年 ${t.getMonth()+1} 月 ${t.getDate()} 日 星期${WEEK[t.getDay()]}`};
let lang="zh";try{lang=localStorage.getItem("dr-lang")||"zh"}catch(e){}
let bpmf=false;try{bpmf=localStorage.getItem("dr-bpmf")==="1"}catch(e){}
if(!["zh","zhj","en"].includes(lang))lang="zh";
const picks={};
/* reading marks: "樂^1" = 1st alternate reading in the zhuyin font (selector U+E01E1). Shown only in 注音 mode. */
const strip=s=>String(s).replace(/\^\d/g,"").replace(/[\u{E01E0}-\u{E01EF}]/gu,"");
const zy=s=>s.replace(/\^(\d)/g,(m,n)=>bpmf&&lang!=="en"?String.fromCodePoint(0xE01E0+Number(n)):"");
function view(o){if(typeof o==="string")return zy(o);if(Array.isArray(o))return o.map(view);if(o&&typeof o==="object"){const r={};for(const k in o)r[k]=view(o[k]);return r}return o}

/* ---------- storage: local device, or Firebase when configured ---------- */
const Store={
 cloud:false,fs:null,user:null,
 async init(){
  try{this.user=JSON.parse(localStorage.getItem("dr-user")||"null")}catch(e){}
  if(!FIREBASE_CONFIG)return;
  try{
   await loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js");
   await loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js");
   firebase.initializeApp(FIREBASE_CONFIG);this.fs=firebase.firestore();this.cloud=true;
  }catch(e){this.cloud=false}
 },
 async login(id,pin){
  id=id.trim();
  if(!id)throw new Error(this.cloud?"請輸入學生代號":"請輸入你的名字");
  if(this.cloud){
   const snap=await this.fs.collection("students").doc(id).get();
   if(!snap.exists||String(snap.data().pin)!==String(pin).trim())throw new Error("代號或密碼不對，請再試一次");
   this.user={id,name:snap.data().name||id};
  }else this.user={id,name:id};
  try{localStorage.setItem("dr-user",JSON.stringify(this.user))}catch(e){}
 },
 logout(){this.user=null;try{localStorage.removeItem("dr-user")}catch(e){}},
 async save(rec){
  if(!this.user)return;
  rec.student=this.user.id;rec.at=new Date().toISOString();
  if(this.cloud){await this.fs.collection("scores").add(rec);return}
  const k="dr-scores-"+this.user.id;let arr=[];
  try{arr=JSON.parse(localStorage.getItem(k)||"[]")}catch(e){}
  arr.push(rec);try{localStorage.setItem(k,JSON.stringify(arr))}catch(e){}
 },
 async list(){
  if(!this.user)return[];
  if(this.cloud){
   const q=await this.fs.collection("scores").where("student","==",this.user.id).get();
   return q.docs.map(d=>d.data()).sort((a,b)=>b.at.localeCompare(a.at));
  }
  try{return JSON.parse(localStorage.getItem("dr-scores-"+this.user.id)||"[]").reverse()}catch(e){return[]}
 }
};
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}

/* ---------- render ---------- */
function tip(w){const h=A[lang].words.find(x=>strip(x[0])===strip(w));return h?strip(h[2]):""}
function bodyHtml(paras){return paras.map(p=>"<p>"+esc(p).replace(/\{([^}]+)\}/g,(m,w)=>{const t=tip(w);return t?`<mark title="${esc(t)}">${w}</mark>`:`<u>${w}</u>`})+"</p>").join("")}

/* 文法專欄：新文章用 G.cols（兩欄，每欄若干小框）；第 1 期沿用舊格式自動轉換 */
function gramCols(G){
 if(G.cols)return G.cols;
 return[[{h:"1. 規則動詞：加 -ed",rows:G.regular},{h:"3. 常搭配的時間詞",p:G.time}],
  [{h:"2. 不規則動詞：要背起來",head:["原形","過去式","中文"],rows:G.irregular,bold:1}]];
}
function gramBox(b,i){
 const st=i?' style="margin-top:14px"':"";
 return `<h3${st}>${b.h}</h3>`+(b.p?`<p style="margin:0">${b.p}</p>`:"")+(b.rows?`<table>${b.head?`<thead><tr>${b.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead>`:""}<tbody>${
  b.rows.map(r=>`<tr>${r.map((c,j)=>`<td>${j===b.bold?`<b>${c}</b>`:c}</td>`).join("")}</tr>`).join("")}</tbody></table>`:"");
}

function render(){
 const L=view(A[lang]),zh=lang!=="en";
 document.documentElement.lang=zh?"zh-Hant":"en";
 document.body.dataset.lang=lang;document.body.classList.toggle("bpmf",bpmf);
 $("bpmfBtn").hidden=!zh;$("bpmfBtn").setAttribute("aria-pressed",bpmf);
 $("bZh").setAttribute("aria-pressed",lang==="zh");$("bZj").setAttribute("aria-pressed",lang==="zhj");$("bEn").setAttribute("aria-pressed",lang==="en");
 $("issue").innerHTML=`第 ${A.no} 期・${dateZh(A.date)}`+(A===LATEST?"":`　<a href="./" style="color:var(--red)">← 回到最新一期</a>`);
 $("photo").innerHTML=ART[A.id]||"";
 $("navStory").textContent=A===LATEST?"今日頭條":"本期文章";
 $("kicker").textContent=L.kicker;$("title").textContent=L.title;$("deck").textContent=L.deck;
 $("byline").innerHTML=`<span>文／酥酥老師改寫</span><span>${L.edition}</span><span>適讀：${L.level}</span><span>${L.len}</span>`;
 $("body").className="cols"+(zh?"":" en");$("body").innerHTML=bodyHtml(L.body);
 $("caption").textContent=L.caption;$("teacherNote").textContent=L.note;
 $("wH").innerHTML=zh?"生詞欄 <span>文章裡畫螢光筆的詞</span>":"Word Bank <span>英文生詞</span>";

  ?`<div class="entry"><b>${w[0]}</b><span class="zy">${w[1]}</span><p>${w[2]}</p><p class="ex">例：${w[3]}</p></div>`
  :`<div class="entry"><b>${w[0]}</b><span class="pos">${w[1]}</span><p>${w[2]}</p><p class="ex">${esc(w[3])}</p></div>`).join("");
 if(zh){
  $("extra").innerHTML=`<h2>成語小教室 <span>${NUM[L.idioms.length]}個成語都能用來描述這則新聞</span></h2><p class="sub"></p><div class="idioms">${
   L.idioms.map(r=>`<div class="idiom"><h3>${r[0]}</h3><dl><dt>意思</dt><dd>${r[1]}</dd><dt>新聞裡</dt><dd>${r[2]}</dd><dt>造句</dt><dd>${r[3]}</dd></dl></div>`).join("")}</div>`;
 }else{

  if(q.k==="sel")b=`<select id="q${i}" aria-label="選擇答案"><option value="">請選擇</option>${q.o.map((o,j)=>`<option value="${j}">${esc(o)}</option>`).join("")}</select>`;
  if(q.k==="txt")b=`<input id="q${i}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="填寫答案">`;
  if(q.k==="open")b=`<textarea id="q${i}" aria-label="寫下你的想法" placeholder="${zh?"這題沒有標準答案，寫下你的想法":"Write your answer here"}"></textarea>`;
  return `<div class="q" id="box${i}"><p class="t">${i+1}. ${esc(q.t)}</p>${b}<div class="fb" id="fb${i}"></div></div>`;
 }).join("")+`<div class="actions"><button class="btn" type="submit">對答案</button><button class="btn ghost" type="button" id="reset">重新作答</button><span class="score" id="score" aria-live="polite"></span></div>`;

 renderUser();buildPrint();

 const think=zh?"讀完後，用三句話把這則新聞說給家人聽。":"Tell your family about this news in three sentences.";
 const p1=`<section class="pg">${mast}
  <span class="kick">${esc(L.kicker)}</span>

   <div><div class="ph">${svg}</div><p class="cap">${esc(L.caption)}</p><div class="sticky hand"><b>酥酥老師的話</b>${esc(L.note)}</div></div></div>
  <div class="think hand" style="margin-top:12px"><b>想一想：</b>${think}</div>

 const vocab=L.words.map(w=>zh
  ?`<div class="vc"><b>${w[0]}</b><span class="z">${w[1]}</span><p>${w[2]}</p><p class="x">例：${w[3]}</p></div>`
  :`<div class="vc"><b>${w[0]}</b><span class="z">${w[1]}</span><p>${w[2]}</p><p class="x">${esc(w[3])}</p></div>`).join("");
 let extra;
 if(zh){
  extra=`<div class="sh red"><span>成語小教室</span><i></i></div><div class="ig" style="grid-template-columns:repeat(${L.idioms.length===4?2:3},1fr)">${L.idioms.map(r=>`<div class="ic"><h3>${r[0]}</h3><dl><dt>意思</dt><dd>${r[1]}</dd><dt>新聞裡</dt><dd>${r[2]}</dd><dt>造句</dt><dd>${r[3]}</dd></dl></div>`).join("")}</div>${L.idioms.length<4?`
   <div class="think hand" style="margin-top:22px"><b>換你造句：</b>從上面選一個成語，寫一個自己的句子。<div class="ln"></div><div class="ln"></div></div>`:""}`;
 }else{
  const G=L.grammar;

   <div class="gt">${gramCols(G).map(col=>`<div class="gb">${col.map(gramBox).join("")}</div>`).join("")}</div>
   <div class="think hand" style="margin-top:12px"><b>換你寫：</b>${G.task||"用過去式寫一句你昨天做的事。"}<div class="ln"></div><div class="ln"></div></div>`;
 }
 const p2=`<section class="pg">${mast}<div data-flow><div class="sh"><span>${zh?"生詞欄":"Word Bank"}</span><i></i></div><div class="vg${zh?"":" e3"}">${vocab}</div>${extra}</div>${foot(2)}</section>`;
 let n=0;
 const qs=L.quiz.map(q=>{

 }).join("");
 const ans=L.quiz.filter(q=>q.k!=="sec").map((q,i)=>`${i+1}. ${q.k==="txt"?q.a:q.k==="open"?"自由作答":q.k==="mc"?"ABCD"[q.a]:q.o[q.a]}`).join("　");

 $("print").innerHTML=p1+p2+p3;
 $("print").classList.toggle("bpmf",bpmf&&zh);

/* split any printed page that runs past A4 onto a continuation page */
function paginate(){
 const root=$("print"),MAX=1150;
 for(let guard=0;guard<12;guard++){
  const pg=[...root.querySelectorAll(".pg")].find(p=>p.offsetHeight>MAX&&p.querySelector("[data-flow]"));
  if(!pg)break;
  const flow=pg.querySelector("[data-flow]");
  const np=document.createElement("section");np.className="pg";
  np.innerHTML=pg.querySelector(".pm").outerHTML+pg.querySelector(".strip2").outerHTML+'<p style="margin:0 0 8px;font-size:12px;color:#888">（接上頁）</p>';
  const nf=document.createElement("div");nf.className=flow.className;nf.setAttribute("data-flow","");np.appendChild(nf);
  let top=flow;while(top.parentElement!==pg)top=top.parentElement;
  let sib=top.nextElementSibling;const tail=[];
  while(sib){const nx=sib.nextElementSibling;if(!sib.classList.contains("ft"))tail.push(sib);sib=nx}
  tail.forEach(t=>np.appendChild(t));
  pg.after(np);
  while(pg.offsetHeight>MAX&&flow.children.length>1)nf.prepend(flow.lastElementChild);
  if(!nf.children.length&&!tail.length){np.remove();break}
 }
 const all=[...root.querySelectorAll(".pg")];
 all.forEach((p,i)=>{let f=p.querySelector(".ft");if(!f){f=document.createElement("div");f.className="ft";p.appendChild(f)}
  f.innerHTML=`<span>酥酥老師每日讀報｜IG、Threads @crispyyyyy0121</span><span>${i+1} / ${all.length}</span>`});
}

async function makePdf(){
 const msg=$("pdfMsg"),btn=$("pdfBtn");
 if(!window.html2canvas||!window.jspdf){msg.textContent="PDF 工具還沒載入完成，請稍後再按一次。";return}
 btn.disabled=true;msg.textContent="正在製作 PDF，請稍等幾秒……";
 try{
  buildPrint();await new Promise(r=>setTimeout(r,50));await document.fonts.ready;paginate();
  const {jsPDF}=window.jspdf,pdf=new jsPDF({unit:"pt",format:"a4"});
  const PW=pdf.internal.pageSize.getWidth(),PH=pdf.internal.pageSize.getHeight();
  const pgs=[...$("print").querySelectorAll(".pg")];
  for(let i=0;i<pgs.length;i++){
   const c=await html2canvas(pgs[i],{scale:2,backgroundColor:"#ffffff",logging:false});
   let w=PW,h=c.height*PW/c.width;
   if(h>PH){w=w*PH/h;h=PH}
   if(i>0)pdf.addPage();
   pdf.addImage(c.toDataURL("image/jpeg",.92),"JPEG",(PW-w)/2,0,w,h);
  }
  const name=`每日讀報_${A.date}_${({zh:"中文國小版",zhj:"中文國中版",en:"英文版"})[lang]}${bpmf&&lang!=="en"?"_注音":""}.pdf`;
  const cl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
  if(cl){await cl.save({filename:name,data:pdf.output("blob")});msg.textContent="PDF 已準備好。"}
  else{pdf.save(name);msg.textContent="PDF 已下載。"}
 }catch(e){msg.textContent="這次沒有存成功，可以再試一次。"}
 btn.disabled=false;
}

function setLang(l){lang=l;try{localStorage.setItem("dr-lang",l)}catch(e){}for(const k in picks)delete picks[k];render()}

document.addEventListener("click",e=>{

$("quiz").addEventListener("submit",async e=>{
 e.preventDefault();
 const qs=view(A[lang]).quiz.filter(q=>q.k!=="sec");let right=0,total=0;
 qs.forEach((q,i)=>{
  const box=$("box"+i),fb=$("fb"+i);box.classList.remove("ok","no");
  if(q.k==="open"){if($("q"+i).value.trim()){box.classList.add("ok");fb.textContent="寫得好！可以拿給老師看看。"}return}
  total++;let ans=null;
  if(q.k==="mc")ans=picks[i]===undefined?null:picks[i];
  if(q.k==="sel")ans=$("q"+i).value===""?null:+$("q"+i).value;
  if(q.k==="txt")ans=$("q"+i).value.trim().toLowerCase();
  const ok=ans===q.a;if(ok)right++;
  box.classList.add(ok?"ok":"no");
  fb.textContent=(ok?"答對了！":"正確答案："+(q.k==="txt"?q.a:q.o[q.a]))+(q.why?"　"+q.why:"");
 });
 $("score").textContent=`${right} / ${total} 題答對`;
 if(Store.user){
  try{await Store.save({article:A.id,no:A.no,title:strip(A[lang].title),lang,right,total});$("score").textContent+="・已記錄";renderScores()}
  catch(err){$("score").textContent+="・這次沒記錄到"}
 }else $("score").textContent+="・登入後可記錄成績";
});
